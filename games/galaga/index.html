<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaga — HTML5</title>
<style>
  :root {
    --bg: #05060d;
    --panel: #0b0e1a;
    --accent: #39f6ff;
    --accent2: #ff4d6d;
    --gold: #ffd23f;
    --text: #d6e2ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at center, #0a0e1f 0%, #05060d 70%);
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 480px;
    height: 720px;
    max-height: 100%;
    aspect-ratio: 2 / 3;
    background: var(--bg);
    border: 2px solid #1b2b4a;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(57, 246, 255, 0.15), inset 0 0 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    background: rgba(5, 6, 13, 0.82);
    backdrop-filter: blur(3px);
    z-index: 5;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 54px; letter-spacing: 8px; margin: 0 0 6px;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(57,246,255,0.6);
  }
  #overlay h2 { font-size: 22px; margin: 10px 0; color: var(--gold); }
  #overlay p { max-width: 340px; line-height: 1.5; opacity: 0.9; font-size: 14px; }
  .btn {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    color: #05060d; background: var(--accent);
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 0 20px rgba(57,246,255,0.5);
    transition: transform .1s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(57,246,255,0.8); }
  .btn.secondary { background: transparent; color: var(--text); border: 2px solid var(--accent); box-shadow: none; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 10px 14px; font-size: 13px; z-index: 3;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #hud .col span { display: block; color: #7f8fb5; font-size: 10px; letter-spacing: 1px; }
  #hud .val { color: #fff; font-weight: 700; font-size: 18px; }
  .score-val { color: var(--gold) !important; }
  .lives-val { color: var(--accent) !important; }
  #levelTag { color: var(--accent2) !important; }
  .hint { font-size: 11px; opacity: 0.6; margin-top: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="480" height="720"></canvas>
    <div id="hud">
      <div class="col">
        <span>SCORE</span>
        <div class="val score-val" id="score">0</div>
      </div>
      <div class="col" style="text-align:center;">
        <span>LEVEL</span>
        <div class="val" id="level">1</div>
      </div>
      <div class="col" style="text-align:right;">
        <span>LIVES</span>
        <div class="val lives-val" id="lives">3</div>
      </div>
    </div>
    <div id="overlay">
      <h1>GALAGA</h1>
      <h2 id="subtitle">HTML5 Remake</h2>
      <p id="overlayText">Pilot your starfighter and repel the Bugster invasion. Dive-bombing enemies will test your reflexes.</p>
      <button class="btn" id="startBtn">START</button>
      <div class="hint">Move ← → or A/D &nbsp;•&nbsp; Fire with Space &nbsp;•&nbsp; Pause with P</div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
