<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMaker: The Game - Cash Clicker Arcade | Free Browser Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0e17; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; }
  #wrap { position: relative; }
  canvas { display: block; border: 1px solid #1c2333; border-radius: 12px; background: #0d1420; box-shadow: 0 0 60px rgba(34, 211, 238, 0.08); }
  #hint { position: absolute; bottom: -34px; left: 0; right: 0; text-align: center; color: #475569; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="hint">[B] BUY &nbsp;&nbsp; [S] SELL &nbsp;&nbsp; [P] PAUSE &nbsp;&nbsp; click or arrows work too</div>
</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  // ---------- audio ----------
  let AC = null;
  function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
  function beep(freq, dur, type, vol) {
    try {
      const a = ac(); const o = a.createOscillator(); const g = a.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (dur || 0.12));
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (dur || 0.12));
    } catch (e) { /* audio blocked */ }
  }
  const snd = {
    buy: () => beep(420, 0.08, 'square', 0.1),
    sell: () => beep(640, 0.08, 'square', 0.1),
    gain: () => { beep(880, 0.1, 'triangle', 0.14); setTimeout(() => beep(1320, 0.12, 'triangle', 0.1), 70); },
    loss: () => beep(180, 0.2, 'sawtooth', 0.1),
    news: () => { beep(220, 0.16, 'sawtooth', 0.12); setTimeout(() => beep(260, 0.16, 'sawtooth', 0.1), 120); },
    tick: () => beep(1200, 0.015, 'sine', 0.02),
    over: () => { beep(392, 0.25, 'sine', 0.15); setTimeout(() => beep(311, 0.25, 'sine', 0.15), 200); setTimeout(() => beep(262, 0.4, 'sine', 0.15), 400); },
    confetti: () => beep(1760, 0.09, 'sine', 0.08),
  };

  // ---------- market ----------
  const START = { cash: 1000, price: 100 };
  const GAME_LEN = 180;           // seconds
  const MARGIN_CALL = 0.45;       // equity < 45% of start -> game over
  const TICK = 0.25;              // seconds per price tick
  const MAX_CANDLES = 140;

  let price = START.price;
  let drift = 0, vol = 0.012;
  let candles = [];               // {o,h,l,c,ts}
  let lastCandle = null;
  let ticks = 0;
  let newsTimer = 8;
  let flashNews = null;           // {text, until}

  function newCandle() {
    if (lastCandle) lastCandle.c = price;
    lastCandle = { o: price, h: price, l: price, c: price, ts: Date.now() };
    candles.push(lastCandle);
    if (candles.length > MAX_CANDLES) candles.shift();
  }
  function stepMarket(dt) {
    ticks += dt;
    // regime drift
    if (Math.random() < dt * 0.08) drift = (Math.random() - 0.5) * vol * 4;
    // volatility ramp
    const ramp = 1 + (1 - elapsed() / GAME_LEN) * 1.2;
    const noise = (Math.random() - 0.5) * vol * ramp * 2 * (1 + Math.abs(drift) / vol);
    price *= 1 + drift + noise;
    if (price < 5) price = 5;
    lastCandle.h = Math.max(lastCandle.h, price);
    lastCandle.l = Math.min(lastCandle.l, price);
    // news events
    newsTimer -= dt;
    if (newsTimer <= 0) {
      newsTimer = 9 + Math.random() * 14;
      fireNews();
    }
    if (flashNews && Date.now() > flashNews.until) flashNews = null;
    if (ticks >= TICK) { ticks = 0; newCandle(); }
  }
  function fireNews() {
    const kind = Math.random();
    let text, volBoost, dir;
    if (kind < 0.18) { text = 'FED SURPRISE RATE CUT'; volBoost = 6; dir = 1; }
    else if (kind < 0.32) { text = 'EARNINGS BEAT ESTIMATES'; volBoost = 5; dir = 1; }
    else if (kind < 0.44) { text = 'SCOOP: CFO DEPARTS'; volBoost = 5; dir = -1; }
    else if (kind < 0.55) { text = 'SHORT SQUEEZE IN PROGRESS'; volBoost = 7; dir = 1; }
    else if (kind < 0.66) { text = 'REGULATORY PROBE OPENS'; volBoost = 6; dir = -1; }
    else if (kind < 0.78) { text = 'PARTNERSHIP WITH MEGA CORP'; volBoost = 4; dir = 1; }
    else if (kind < 0.89) { text = 'SUPPLY CHAIN DISRUPTION'; volBoost = 5; dir = -1; }
    else { text = 'ANALYST UPGRADE — BUY RATING'; volBoost = 4; dir = 1; }
    const move = vol * volBoost * (0.5 + Math.random());
    price = Math.max(5, price * (1 + dir * move));
    drift = dir * move * 0.6;
    volBoost; // mark used
    flashNews = { text, until: Date.now() + 2200 };
    snd.news();
    for (let i = 0; i < 26; i++) spawnParticle(W / 2 + (Math.random() - 0.5) * 480, 120, dir > 0 ? '#34d399' : '#f87171', 3);
    newCandle();
  }

  // ---------- player ----------
  let cash = START.cash;
  let shares = 0;
  let entryPrice = 0;
  let realized = 0;            // total realized profit
  let streak = 0;              // consecutive profitable trades
  let bestStreak = 0;
  let trades = 0;
  let roundTrip = false;       // just closed a position
  const equity = () => cash + shares * price;
  const pnl = () => shares > 0 ? (price - entryPrice) * shares : 0;
  let elapsed = () => (performance.now() - startAt) / 1000;
  let startAt = performance.now();
  let state = 'menu';          // menu | play | over
  let paused = false;
  let pauseAt = 0;
  let marginFlash = null;
  let resultStats = null;
  const best = () => Number(localStorage.getItem('mm_arcade_best') || 0);

  function buy() {
    if (state !== 'play' || shares > 0) return;
    const afford = Math.floor(cash / price);
    if (afford < 1) { flash('NOT ENOUGH CASH'); snd.loss(); return; }
    shares = afford; entryPrice = price; cash -= shares * price;
    trades++;
    streak = 0;
    roundTrip = false;
    snd.buy();
    spawnParticle(W * 0.78, 470, '#22d3ee', 4);
  }
  function sell() {
    if (state !== 'play' || shares <= 0) return;
    cash += shares * price;
    const profit = (price - entryPrice) * shares;
    realized += profit;
    if (profit > 0) { streak++; bestStreak = Math.max(bestStreak, streak); snd.gain(); spawnConfetti(); }
    else { streak = 0; snd.loss(); }
    roundTrip = true;
    shares = 0; entryPrice = 0;
    flash(profit >= 0 ? `+$${fmt(profit)}` : `-$${fmt(-profit)}`, profit >= 0 ? '#34d399' : '#f87171');
    if (equity() > best()) localStorage.setItem('mm_arcade_best', String(equity()));
  }
  function marginCall() {
    state = 'over';
    marginFlash = { until: Date.now() + 400 };
    snd.over();
    resultStats = { reason: 'MARGIN CALL — your equity fell below 45% of starting capital.', equity: equity(), realized, trades, bestStreak, time: elapsed() };
  }
  function endRun() {
    state = 'over';
    snd.over();
    resultStats = { reason: 'MARKET CLOSED — 3:00 timer expired.', equity: equity(), realized, trades, bestStreak, time: elapsed() };
  }
  let flashText = null;
  function flash(t, color) {
    flashText = { t, color: color || '#e2e8f0', until: Date.now() + 1400 };
  }
  function reset() {
    price = START.price; drift = 0; vol = 0.012;
    candles = []; ticks = 0; newsTimer = 8; flashNews = null;
    cash = START.cash; shares = 0; entryPrice = 0; realized = 0;
    streak = 0; bestStreak = 0; trades = 0; roundTrip = false;
    startAt = performance.now(); state = 'play'; paused = false; pauseAt = 0;
    resultStats = null; marginFlash = null;
    newCandle(); newCandle(); newCandle(); newCandle();
  }

  // ---------- particles ----------
  const particles = [];
  function spawnParticle(x, y, color, n, vy) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 140,
        vy: (Math.random() - 0.5) * 140 + (vy || 0),
        life: 0.5 + Math.random() * 0.6,
        max: 1,
        size: 1.5 + Math.random() * 3,
        color,
      });
    }
  }
  function spawnConfetti() {
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: W * 0.78 + (Math.random() - 0.5) * 40, y: 440,
        vx: (Math.random() - 0.5) * 260, vy: -120 - Math.random() * 180,
        life: 0.7 + Math.random() * 0.8, max: 1,
        size: 2 + Math.random() * 3,
        color: ['#34d399', '#fbbf24', '#22d3ee', '#f472b6'][Math.floor(Math.random() * 4)],
        gravity: 320,
      });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.gravity) p.vy += p.gravity * dt;
    }
    for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // ---------- draw ----------
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  function drawChart(gx, gy, gw, gh) {
    if (candles.length < 2) return;
    const span = candles.length;
    const cw = gw / span;
    const xs = (i) => gx + i * cw + cw / 2;
    const min = Math.min(...candles.map(c => c.l));
    const max = Math.max(...candles.map(c => c.h));
    const pad = Math.max((max - min) * 0.08, 0.01);
    const ys = (v) => gy + gh - ((v - (min - pad)) / (max - min + 2 * pad)) * gh;
    ctx.lineWidth = 1;
    for (let i = 0; i < candles.length; i++) {
      const c = candles[i];
      const up = c.c >= c.o;
      ctx.strokeStyle = up ? '#34d399' : '#f87171';
      ctx.fillStyle = up ? 'rgba(52,211,153,0.45)' : 'rgba(248,113,113,0.45)';
      const x = xs(i);
      ctx.beginPath(); ctx.moveTo(x, ys(c.h)); ctx.lineTo(x, ys(c.l)); ctx.stroke();
      const bw = Math.max(2, cw * 0.6);
      ctx.fillRect(x - bw / 2, Math.min(ys(c.o), ys(c.c)), bw, Math.max(2, Math.abs(ys(c.o) - ys(c.c))));
    }
    // price line
    ctx.strokeStyle = 'rgba(226,232,240,0.25)';
    ctx.beginPath();
    for (let i = 0; i < candles.length; i++) { const x = xs(i), y = ys(candles[i].c); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    // grid
    ctx.strokeStyle = 'rgba(148,163,184,0.07)';
    for (let g = 0; g < 4; g++) {
      const y = gy + (gh / 4) * g;
      ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke();
    }
    return { min: min - pad, max: max + pad, ys };
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function btn(x, y, w, h, label, color, sub) {
    roundRect(x, y, w, h, 10);
    ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 20px Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y + h / 2 + 7);
    if (sub) { ctx.font = '10px Menlo, monospace'; ctx.fillStyle = 'rgba(248,250,252,0.6)'; ctx.fillText(sub, x + w / 2, y + h / 2 + 24); }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d1420'; ctx.fillRect(0, 0, W, H);

    // subtle grid
    ctx.strokeStyle = 'rgba(148,163,184,0.05)';
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    if (state === 'menu') { drawMenu(); return; }

    // ---- HUD ----
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px Menlo, monospace';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('$$ MONEYMAKER', 26, 38);
    ctx.font = '12px Menlo, monospace';
    ctx.fillStyle = '#64748b';
    const t = Math.max(0, GAME_LEN - elapsed());
    const mm = Math.floor(t / 60), ss = Math.floor(t % 60);
    ctx.fillText('MARKET: ' + (state === 'play' ? `${mm}:${String(ss).padStart(2, '0')}` : 'CLOSED'), 26, 60);

    // price readout
    ctx.textAlign = 'right';
    ctx.font = 'bold 34px Menlo, monospace';
    ctx.fillStyle = price >= START.price ? '#34d399' : '#f87171';
    ctx.fillText('$' + price.toFixed(2), W - 26, 44);

    ctx.font = '12px Menlo, monospace';
    const chg = price - START.price;
    ctx.fillStyle = chg >= 0 ? '#34d399' : '#f87171';
    ctx.fillText((chg >= 0 ? '+' : '') + chg.toFixed(2) + ' since open', W - 26, 62);

    // equity strip
    ctx.textAlign = 'left';
    const eq = equity();
    ctx.font = 'bold 14px Menlo, monospace';
    ctx.fillStyle = eq >= START.cash ? '#34d399' : '#f87171';
    ctx.fillText(`EQUITY  $${fmt(eq)}`, 26, 96);
    ctx.fillStyle = '#64748b';
    ctx.font = '12px Menlo, monospace';
    ctx.fillText(`CASH $${fmt(cash)} · ${shares} SHARES @ $${(entryPrice || price).toFixed(2)}` + (shares > 0 ? `  ·  POSITION +$${fmt(pnl())}` : ''), 26, 116);

    // realized / streak
    ctx.textAlign = 'right';
    ctx.fillStyle = realized >= 0 ? '#34d399' : '#f87171';
    ctx.fillText(`REALIZED ${realized >= 0 ? '+' : ''}$${fmt(realized)}`, W - 26, 96);
    ctx.fillStyle = streak >= 2 ? '#fbbf24' : '#64748b';
    ctx.fillText(`STREAK ×${streak} ${streak >= 2 ? '🔥' : ''}`, W - 26, 116);

    // ---- chart ----
    const gx = 40, gy = 145, gw = W - 80, gh = 320;
    drawChart(gx, gy, gw, gh);

    // ---- news ticker ----
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(40, H - 84, gw, 30);
    ctx.strokeStyle = 'rgba(251,191,36,0.5)'; ctx.strokeRect(40, H - 84, gw, 30);
    ctx.textAlign = 'left';
    ctx.font = 'bold 13px Menlo, monospace';
    ctx.fillStyle = '#fbbf24';
    if (flashNews) {
      ctx.fillText('▸ BREAKING: ' + flashNews.text, 52, H - 64);
    } else if (roundTrip) {
      ctx.fillStyle = '#64748b';
      ctx.fillText('waiting for signal…', 52, H - 64);
    } else {
      ctx.fillStyle = '#64748b';
      ctx.fillText('waiting for a dip or a spike — time it.', 52, H - 64);
    }

    // ---- buy/sell buttons ----
    btn(40, H - 46, 200, 38, '[B] BUY', 'rgba(52,211,153,0.9)', 'all-in on the dip');
    btn(W - 240, H - 46, 200, 38, '[S] SELL', 'rgba(248,113,113,0.9)', 'lock in profits');

    // paused
    if (state === 'play' && paused) {
      ctx.fillStyle = 'rgba(13,20,32,0.82)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 28px Menlo, monospace';
      ctx.fillText('PAUSED', W / 2, H / 2 - 10);
      ctx.font = '13px Menlo, monospace';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('press [P] to resume', W / 2, H / 2 + 20);
    }

    // margin call warning
    if (state === 'play' && eq < START.cash * MARGIN_CALL + START.cash * 0.1) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 120);
      ctx.strokeStyle = `rgba(248,113,113,${0.3 + pulse * 0.5})`;
      ctx.lineWidth = 3;
      roundRect(10, 10, W - 20, H - 20, 14); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.textAlign = 'center';
      ctx.font = 'bold 13px Menlo, monospace';
      ctx.fillStyle = `rgba(248,113,113,${0.5 + pulse * 0.5})`;
      ctx.fillText('⚠ MARGIN WARNING — CLOSE BELOW 45% = GAME OVER', W / 2, H - 8);
    }

    // game over overlay
    if (state === 'over') drawOver();

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // floating flash text
    if (flashText && Date.now() < flashText.until) {
      const a = 1 - (flashText.until - Date.now()) / 1400;
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px Menlo, monospace';
      ctx.fillStyle = flashText.color;
      ctx.fillText(flashText.t, W / 2, 130);
      ctx.globalAlpha = 1;
    }
  }
  function drawMenu() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 52px Menlo, monospace';
    ctx.fillText('MONEYMAKER', W / 2, 180);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 22px Menlo, monospace';
    ctx.fillText('The Game', W / 2, 222);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px Menlo, monospace';
    ctx.fillText('Buy low. Sell high. Survive the news.', W / 2, 268);
    ctx.fillText('A bull market can end at any moment.', W / 2, 290);
    ctx.fillText('Your equity starts at $1,000. A 55% drawdown = margin call.', W / 2, 312);
    ctx.fillText('Profit streaks pay nothing extra — they are just flexing.', W / 2, 334);

    btn(W / 2 - 130, 370, 260, 52, '▶  TRADE NOW', 'rgba(34,211,238,0.9)', '3-minute market session');

    ctx.fillStyle = '#64748b';
    ctx.font = '12px Menlo, monospace';
    ctx.fillText(`[B] buy  ·  [S] sell  ·  [P] pause  ·  [R] restart  ·  [M] menu`, W / 2, 470);
    ctx.fillText('Sound on for the full experience.', W / 2, 490);

    if (best() > START.cash) {
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 15px Menlo, monospace';
      ctx.fillText(`BEST SESSION: $${fmt(best())}`, W / 2, 540);
    }
  }
  function drawOver() {
    ctx.fillStyle = 'rgba(13,20,32,0.88)'; ctx.fillRect(0, 0, W, H);
    const r = resultStats;
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px Menlo, monospace';
    ctx.fillStyle = r.equity >= START.cash ? '#34d399' : '#f87171';
    ctx.fillText(r.equity >= START.cash ? 'SESSION CLOSED IN THE GREEN' : 'MARGIN CALLED', W / 2, 170);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 34px Menlo, monospace';
    ctx.fillText('FINAL EQUITY  $' + fmt(r.equity), W / 2, 232);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '15px Menlo, monospace';
    const secs = Math.floor(r.time);
    ctx.fillText(`${fmt(r.realized >= 0 ? r.realized : -r.realized)} ${r.realized >= 0 ? 'realized profit' : 'realized loss'}  ·  ${r.trades} trades  ·  best streak ×${r.bestStreak}  ·  ${secs}s`, W / 2, 266);
    ctx.fillText(r.reason, W / 2, 296);

    const isBest = r.equity > best() && r.equity > START.cash;
    if (isBest) {
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 18px Menlo, monospace';
      ctx.fillText('★ NEW PERSONAL BEST ★', W / 2, 330);
    }

    btn(W / 2 - 290, 360, 180, 48, '[R] RETRY', 'rgba(34,211,238,0.9)');
    btn(W / 2 - 90, 360, 180, 48, '[M] MENU', 'rgba(148,163,184,0.9)');
    ctx.fillStyle = '#64748b';
    ctx.font = '12px Menlo, monospace';
    ctx.fillText('share your score: "I made $' + fmt(r.equity) + ' in MoneyMaker. beat me"', W / 2, 450);
  }

  // ---------- input ----------
  function key(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'b' || k === 'arrowleft' || k === '1') buy();
    if (k === 's' || k === 'arrowright' || k === '2') sell();
    if (k === 'p') {
      if (state === 'play') {
        if (!paused) { paused = true; pauseAt = performance.now(); }
        else { startAt += performance.now() - pauseAt; paused = false; }
      }
    }
    if (k === 'r') { if (state !== 'menu') { reset(); } }
    if (k === 'm') state = 'menu';
    if (k === ' ' && state === 'menu') reset();
    if (k === 'enter' && state === 'over') reset();
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' && state === 'menu') e.preventDefault();
    key(e);
  });
  cv.addEventListener('click', (e) => {
    ac();
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    if (state === 'menu') { if (x > W / 2 - 130 && x < W / 2 + 130 && y > 370 && y < 422) reset(); return; }
    if (state === 'over') {
      if (x > W / 2 - 290 && x < W / 2 - 110 && y > 360 && y < 408) reset();
      if (x > W / 2 - 90 && x < W / 2 + 90 && y > 360 && y < 408) state = 'menu';
      return;
    }
    if (x > 40 && x < 240 && y > H - 46 && y < H - 8) buy();
    if (x > W - 240 && x < W - 40 && y > H - 46 && y < H - 8) sell();
  });

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    let dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (state === 'play') {
      if (!paused) {
        stepMarket(dt);
        if (equity() < START.cash * MARGIN_CALL) marginCall();
        else if (elapsed() >= GAME_LEN) endRun();
        updateParticles(dt);
        if (Math.random() < dt * 0.5) snd.tick();
      }
    } else {
      updateParticles(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }
  newCandle(); newCandle(); newCandle(); newCandle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
