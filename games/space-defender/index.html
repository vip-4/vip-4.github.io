<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #gameCanvas { display: block; background: linear-gradient(180deg, #000428 0%, #004e92 100%); cursor: crosshair; }
        .game-ui { position: absolute; top: 0; left: 0; right: 0; padding: 20px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
        
        .ui-left-panel { display: flex; align-items: center; gap: 20px; }
        .ui-right-panel { display: flex; align-items: center; gap: 20px; }
        
        .score-panel, .lives-panel, .level-panel, .coins-panel, .timer-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 10px 20px;
            color: #00ff88;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff88;
        }

        .coins-panel { border-color: #ffd700; color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .timer-panel { border-color: #ff6600; color: #ff6600; text-shadow: 0 0 10px #ff6600; }

        .pause-btn, .mute-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff88;
            color: #00ff88;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.2s;
        }
        .pause-btn:hover, .mute-btn:hover { background: rgba(0, 255, 136, 0.3); transform: scale(1.1); }
        
        .game-over-screen, .start-screen, .pause-screen, .shop-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.9); z-index: 20;
        }

        .pause-options { margin-top: 30px; display: flex; gap: 20px; align-items: center; }
        
        .game-title {
            font-size: 48px; font-weight: bold; color: #00ff88;
            text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88;
            margin-bottom: 20px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        #levelUpScreen, #bonusLevelScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00, 0 0 40px #ff8800;
            z-index: 50;
            pointer-events: none;
            display: none;
            animation: level-up-anim 2s ease-out forwards;
        }

        @keyframes level-up-anim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* Shop styles */
        .shop-container {
            background: rgba(0, 20, 40, 0.95);
            border: 3px solid #00ff88;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
        }

        .shop-title {
            font-size: 36px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }

        .shop-coins {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 30px;
            text-align: center;
        }

        .shop-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }

        .shop-item-info {
            flex: 1;
            color: white;
        }

        .shop-item-name {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
        }

        .shop-item-desc {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }

        .shop-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .shop-quantity {
            color: white;
            font-size: 18px;
            min-width: 30px;
            text-align: center;
        }

        .shop-btn {
            width: 30px;
            height: 30px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shop-btn:hover:not(:disabled) {
            background: rgba(0, 255, 136, 0.4);
        }

        .shop-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .shop-price {
            color: #ffd700;
            font-size: 16px;
            margin-left: 10px;
        }

        .shop-continue {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            border: none;
            border-radius: 50px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shop-continue:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #00ff88;
        }
        
        .btn-start {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            border: none; border-radius: 50px; color: #000; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-start:hover { transform: scale(1.1); box-shadow: 0 0 30px #00ff88; }
        
        .controls-info { margin-top: 30px; text-align: center; color: #fff; }
        .control-item { margin: 10px 0; font-size: 16px; }
        .control-item strong { color: #00ff88; border: 1px solid #fff; padding: 2px 6px; border-radius: 4px; }
        
        .touch-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; z-index: 15; }
        .touch-btn { width: 60px; height: 60px; background: rgba(0, 255, 136, 0.3); border: 2px solid #00ff88; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #00ff88; font-size: 24px; cursor: pointer; transition: all 0.2s; }
        .touch-btn:active { background: rgba(0, 255, 136, 0.6); transform: scale(0.95); }
        .fire-btn { width: 80px; height: 80px; background: rgba(255, 0, 0, 0.3); border-color: #ff0044; color: #ff0044; }
        .fire-btn:active { background: rgba(255, 0, 0, 0.6); }
        
        @media (max-width: 768px) { .touch-controls { display: flex; } .game-title { font-size: 32px; } .controls-info { display: none; } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="game-ui">
        <div class="ui-left-panel">
            <div class="score-panel">SCORE: <span id="score">0</span></div>
            <div class="level-panel">LEVEL: <span id="level">1</span></div>
            <div class="coins-panel" id="coinsPanel" style="display: none;">COINS: <span id="coins">0</span></div>
            <div class="timer-panel" id="timerPanel" style="display: none;">TIME: <span id="timer">10</span></div>
        </div>
        <div class="ui-right-panel">
            <div class="lives-panel">LIVES: <span id="lives">3</span></div>
            <div class="pause-btn" id="pauseBtn">❚❚</div>
        </div>
    </div>
    
    <div class="start-screen" id="startScreen">
        <h1 class="game-title">SPACE DEFENDER</h1>
        <button class="btn-start" onclick="startGame()">START GAME</button>
        <div class="controls-info">
            <div class="control-item"><strong>⬅️</strong> <strong>➡️</strong> or <strong>A</strong> <strong>D</strong> to Move</div>
            <div class="control-item"><strong>SPACE</strong> or <strong>Click</strong> to Shoot</div>
            <div class="control-item"><strong>P</strong> to Pause/Resume</div>
        </div>
    </div>

    <div class="pause-screen" id="pauseScreen" style="display: none;">
        <h1 class="game-title" style="animation: none;">PAUSED</h1>
        <div class="pause-options">
            <button class="mute-btn" id="muteBtn">🔊</button>
        </div>
    </div>

    <!-- Shop Screen -->
    <div class="shop-screen" id="shopScreen" style="display: none;">
        <div class="shop-container">
            <h2 class="shop-title">🏪 SHOP 🏪</h2>
            <div class="shop-coins">💰 Coins: <span id="shopCoins">0</span></div>
            <div class="shop-items">
                <div class="shop-item">
                    <div class="shop-item-info">
                        <div class="shop-item-name">❤️ Extra Life</div>
                        <div class="shop-item-desc">Add an extra life to your ship</div>
                    </div>
                    <div class="shop-item-controls">
                        <button class="shop-btn" onclick="changeQuantity('life', -1)">-</button>
                        <span class="shop-quantity" id="lifeQuantity">0</span>
                        <button class="shop-btn" onclick="changeQuantity('life', 1)">+</button>
                        <span class="shop-price">50 💰</span>
                    </div>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info">
                        <div class="shop-item-name">🛡️ Shield</div>
                        <div class="shop-item-desc">10 seconds of protection at level start</div>
                    </div>
                    <div class="shop-item-controls">
                        <button class="shop-btn" onclick="changeQuantity('shield', -1)">-</button>
                        <span class="shop-quantity" id="shieldQuantity">0</span>
                        <button class="shop-btn" onclick="changeQuantity('shield', 1)">+</button>
                        <span class="shop-price">100 💰</span>
                    </div>
                </div>
            </div>
            <button class="shop-continue" onclick="finishShopping()">CONTINUE</button>
        </div>
    </div>
    
    <div class="game-over-screen" id="gameOverScreen" style="display: none;">
        <h1 class="game-title">GAME OVER</h1>
        <div style="color: #fff; font-size: 24px; margin: 20px;">
            Final Score: <span id="finalScore" style="color: #00ff88;">0</span>
        </div>
        <button class="btn-start" onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <div id="levelUpScreen"></div>
    <div id="bonusLevelScreen"></div>
    
    <div class="touch-controls">
        <button class="touch-btn" id="leftBtn">⬅️</button>
        <button class="touch-btn" id="rightBtn">➡️</button>
        <button class="touch-btn fire-btn" id="fireBtn">🔥</button>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseScreen = document.getElementById('pauseScreen');
        const muteBtn = document.getElementById('muteBtn');
        const levelUpScreen = document.getElementById('levelUpScreen');
        const bonusLevelScreen = document.getElementById('bonusLevelScreen');
        const shopScreen = document.getElementById('shopScreen');
        const coinsPanel = document.getElementById('coinsPanel');
        const timerPanel = document.getElementById('timerPanel');
        
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        let isMuted = false;
        let gameState = 'start';
        let score = 0;
        let lives = 3;
        let animationId;
        let level = 1;
        let invaderSpeed = 1;
        let invaderShootRate = 0.001;
        let asteroidSpawnRate = 0.02;
        let enemyBulletSpeed = 3;
        
        // Bonus level variables
        let isBonusLevel = false;
        let bonusCoins = 0;
        let bonusTimer = 10;
        let bonusInterval = null;
        let treasureChests = [];
        
        // Shield variables
        let hasShield = false;
        let shieldTimer = 0;
        let shieldActive = false;
        
        // Shop variables
        let shopItems = {
            life: { quantity: 0, price: 50 },
            shield: { quantity: 0, price: 100 }
        };
        
        function playSound(frequency, duration, type = 'sine') {
            if (isMuted) return;
            if (audioContext.state === 'suspended') { audioContext.resume(); }
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const stars = [];
        for (let i = 0; i < 100; i++) { 
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.5 + 0.1 }); 
        }
        
        const player = { x: canvas.width / 2, y: canvas.height - 100, width: 60, height: 60, speed: 7, movingLeft: false, movingRight: false };
        const bullets = [], enemyBullets = [], asteroids = [], invaders = [], particles = [];
        let invaderDirection = 1;
        
        class Particle {
            constructor(x, y, color) { 
                this.x = x; this.y = y; 
                this.vx = (Math.random() - 0.5) * 8; 
                this.vy = (Math.random() - 0.5) * 8; 
                this.size = Math.random() * 3 + 1; 
                this.life = 1; this.color = color; 
            }
            update() { 
                this.x += this.vx; this.y += this.vy; 
                this.life -= 0.02; this.size *= 0.98; 
            }
            draw() { 
                ctx.save(); ctx.globalAlpha = this.life; 
                ctx.fillStyle = this.color; ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill(); ctx.restore(); 
            }
        }

        // Coin particle for visual feedback
        class CoinParticle {
            constructor(x, y, value) {
                this.x = x;
                this.y = y;
                this.value = value;
                this.vy = -2;
                this.life = 1;
            }
            update() {
                this.y += this.vy;
                this.vy *= 0.95;
                this.life -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = '#ffd700';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeText(`+${this.value}💰`, this.x - 30, this.y);
                ctx.fillText(`+${this.value}💰`, this.x - 30, this.y);
                ctx.restore();
            }
        }
        
        const coinParticles = [];
        
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') { e.preventDefault(); shootBullet(); }
            if (e.key.toLowerCase() === 'p') { togglePause(); }
        });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        pauseBtn.addEventListener('click', togglePause);
        muteBtn.addEventListener('click', toggleMute);
        
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); player.movingLeft = true; });
        document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); player.movingLeft = false; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); player.movingRight = true; });
        document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); player.movingRight = false; });
        document.getElementById('fireBtn').addEventListener('touchstart', (e) => { e.preventDefault(); shootBullet(); });
        
        canvas.addEventListener('click', shootBullet);
        
        function shootBullet() {
            if (gameState !== 'playing') return;
            bullets.push({ x: player.x, y: player.y - 20, width: 4, height: 15, speed: 10 });
            playSound(800, 0.1, 'square');
        }
        
        function createAsteroid() {
            const speed = (Math.random() * 3 + 1) * (1 + (level - 1) * 0.1);
            asteroids.push({ 
                x: Math.random() * canvas.width, y: -50, 
                size: Math.random() * 30 + 20, speed: speed, 
                rotation: 0, rotationSpeed: (Math.random() - 0.5) * 0.1 
            });
        }
        
        function createInvaders() {
            invaders.length = 0;
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 8; col++) {
                    invaders.push({ 
                        x: col * 80 + 100, 
                        y: row * 60 + 50, 
                        width: 40, height: 30, 
                        alive: true, 
                        type: row < 2 ? 'strong' : 'weak' 
                    });
                }
            }
        }

        function createTreasureChests() {
            treasureChests.length = 0;
            for (let i = 0; i < 8; i++) {
                treasureChests.push({
                    x: canvas.width + i * 200,
                    y: 100 + Math.random() * (canvas.height - 300),
                    width: 60,
                    height: 50,
                    speed: 3,
                    value: Math.floor(Math.random() * 4 + 1) * 10, // 10, 20, 30, or 40 coins
                    alive: true
                });
            }
        }
        
        function updatePlayer() {
            if (keys['arrowleft'] || keys['a'] || player.movingLeft) { player.x -= player.speed; }
            if (keys['arrowright'] || keys['d'] || player.movingRight) { player.x += player.speed; }
            player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, player.x));
        }
        
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                if (!bullet) continue;
                bullet.y -= bullet.speed;
                if (bullet.y < 0) { bullets.splice(i, 1); continue; }
                
                // Check collision with treasure chests in bonus level
                if (isBonusLevel) {
                    for (let j = treasureChests.length - 1; j >= 0; j--) {
                        const chest = treasureChests[j];
                        if (chest.alive && checkCollision(bullet, chest)) {
                            createExplosion(chest.x, chest.y, '#ffd700');
                            coinParticles.push(new CoinParticle(chest.x, chest.y, chest.value));
                            bonusCoins += chest.value;
                            updateCoins();
                            chest.alive = false;
                            bullets.splice(i, 1);
                            playSound(1000, 0.1, 'sine');
                            playSound(1200, 0.1, 'sine');
                            break;
                        }
                    }
                    continue;
                }
                
                // Regular level collisions
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    if (checkCollision(bullet, asteroids[j])) {
                        createExplosion(asteroids[j].x, asteroids[j].y, '#ff6600');
                        asteroids.splice(j, 1);
                        bullets.splice(i, 1);
                        score += 10;
                        updateScore();
                        playSound(200, 0.2, 'sawtooth');
                        break;
                    }
                }
                if (!bullets[i]) continue;
                
                for (let j = invaders.length - 1; j >= 0; j--) {
                    const invader = invaders[j];
                    if (invader.alive && checkCollision(bullet, invader)) {
                        createExplosion(invader.x, invader.y, '#00ff00');
                        invader.alive = false;
                        bullets.splice(i, 1);
                        score += invader.type === 'strong' ? 20 : 10;
                        updateScore();
                        playSound(150, 0.2, 'triangle');
                        break;
                    }
                }
            }
        }
        
        function updateEnemyBullets() {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += enemyBullets[i].speed;
                if (enemyBullets[i].y > canvas.height) { enemyBullets.splice(i, 1); continue; }
                
                // Check if shield is active
                if (shieldActive) {
                    if (checkCollision(enemyBullets[i], player)) {
                        createExplosion(enemyBullets[i].x, enemyBullets[i].y, '#00ccff');
                        enemyBullets.splice(i, 1);
                        playSound(500, 0.1, 'sine');
                        continue;
                    }
                } else if (checkCollision(enemyBullets[i], player)) {
                    createExplosion(player.x, player.y, '#ff0000');
                    enemyBullets.splice(i, 1);
                    lives--;
                    updateLives();
                    playSound(100, 0.3, 'sawtooth');
                    if (lives <= 0) { gameOver(); }
                }
            }
        }
        
        function updateAsteroids() {
            for (let i = asteroids.length - 1; i >= 0; i--) {
                asteroids[i].y += asteroids[i].speed;
                asteroids[i].rotation += asteroids[i].rotationSpeed;
                if (asteroids[i].y > canvas.height + 50) { asteroids.splice(i, 1); continue; }
                
                // Shield protection
                if (shieldActive) {
                    if (checkCollision(asteroids[i], player)) {
                        createExplosion(asteroids[i].x, asteroids[i].y, '#00ccff');
                        asteroids.splice(i, 1);
                        playSound(500, 0.1, 'sine');
                        continue;
                    }
                } else if (checkCollision(asteroids[i], player)) {
                    createExplosion(asteroids[i].x, asteroids[i].y, '#ff6600');
                    asteroids.splice(i, 1);
                    lives--;
                    updateLives();
                    playSound(100, 0.3, 'sawtooth');
                    if (lives <= 0) { gameOver(); }
                }
            }
        }

        function updateInvaders() {
            let shouldChangeDirection = false;
            for (let invader of invaders) {
                if (!invader.alive) continue;
                invader.x += invaderSpeed * invaderDirection;
                if (invader.x <= 20 || invader.x >= canvas.width - 20) { shouldChangeDirection = true; }
                
                // Check if invader reached player level - game over
                if (invader.y + 30 >= player.y - 30) {
                    gameOver();
                    return;
                }
                
                if (Math.random() < invaderShootRate) {
                    enemyBullets.push({ x: invader.x, y: invader.y + 20, width: 4, height: 10, speed: enemyBulletSpeed });
                    playSound(400, 0.1, 'sine');
                }
            }
            if (shouldChangeDirection) {
                invaderDirection *= -1;
                for (let invader of invaders) { invader.y += 20; }
            }
            if (invaders.every(inv => !inv.alive)) {
                score += 100;
                updateScore();
                lives++; // Bonus life for completing level
                updateLives();
                playSound(800, 0.3, 'triangle');
                nextLevel();
            }
        }

        function updateTreasureChests() {
            for (let chest of treasureChests) {
                if (!chest.alive) continue;
                chest.x -= chest.speed;
                if (chest.x < -100) {
                    chest.alive = false;
                }
            }
            
            // Check if all chests are gone or timer is up
            if (treasureChests.every(chest => !chest.alive) || bonusTimer <= 0) {
                endBonusLevel();
            }
        }

        function updateCoinParticles() {
            for (let i = coinParticles.length - 1; i >= 0; i--) {
                coinParticles[i].update();
                if (coinParticles[i].life <= 0) {
                    coinParticles.splice(i, 1);
                }
            }
        }

        function updateShield() {
            if (shieldActive) {
                shieldTimer--;
                if (shieldTimer <= 0) {
                    shieldActive = false;
                    hasShield = false;
                }
            }
        }

        function updateParticles() { 
            for (let i = particles.length - 1; i >= 0; i--) { 
                particles[i].update(); 
                if (particles[i].life <= 0) { particles.splice(i, 1); } 
            } 
        }
        
        function createExplosion(x, y, color) { 
            for (let i = 0; i < 20; i++) { 
                particles.push(new Particle(x, y, color)); 
            } 
        }
        
        function checkCollision(obj1, obj2) { 
            if (!obj1 || !obj2) return false; 
            const dx = obj1.x - obj2.x; 
            const dy = obj1.y - obj2.y; 
            const distance = Math.sqrt(dx * dx + dy * dy); 
            if (obj1.size && obj2.width) { 
                return distance < obj1.size + obj2.width/2; 
            } else if (obj2.size && obj1.width) { 
                return distance < obj2.size + obj1.width/2; 
            } else { 
                return Math.abs(dx) < (obj1.width + obj2.width) / 2 && 
                       Math.abs(dy) < (obj1.height + obj2.height) / 2; 
            } 
        }
        
        function drawPlayer() { 
            ctx.save(); 
            ctx.translate(player.x, player.y); 
            
            // Draw shield if active
            if (shieldActive) {
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.01) * 0.2;
                ctx.beginPath();
                ctx.arc(0, 0, 50, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
            
            ctx.fillStyle = '#00ff88'; 
            ctx.beginPath(); 
            ctx.moveTo(0, -30); 
            ctx.lineTo(-20, 20); 
            ctx.lineTo(0, 10); 
            ctx.lineTo(20, 20); 
            ctx.closePath(); 
            ctx.fill(); 
            ctx.fillStyle = '#00ccff'; 
            ctx.beginPath(); 
            ctx.arc(0, -5, 8, 0, Math.PI * 2); 
            ctx.fill(); 
            if (keys['arrowleft'] || keys['a'] || keys['arrowright'] || keys['d'] || player.movingLeft || player.movingRight) { 
                ctx.fillStyle = '#ff6600'; 
                ctx.beginPath(); 
                ctx.moveTo(-10, 20); 
                ctx.lineTo(0, 35 + Math.random() * 5); 
                ctx.lineTo(10, 20); 
                ctx.closePath(); 
                ctx.fill(); 
            } 
            ctx.restore(); 
        }
        
        function drawBullets() { 
            ctx.fillStyle = '#ffff00'; 
            for (let bullet of bullets) { 
                ctx.shadowBlur = 10; 
                ctx.shadowColor = '#ffff00'; 
                ctx.fillRect(bullet.x - bullet.width/2, bullet.y, bullet.width, bullet.height); 
            } 
            ctx.shadowBlur = 0; 
            ctx.fillStyle = '#ff0044'; 
            for (let bullet of enemyBullets) { 
                ctx.shadowBlur = 10; 
                ctx.shadowColor = '#ff0044'; 
                ctx.fillRect(bullet.x - bullet.width/2, bullet.y, bullet.width, bullet.height); 
            } 
            ctx.shadowBlur = 0; 
        }
        
        function drawAsteroids() { 
            for (let asteroid of asteroids) { 
                ctx.save(); 
                ctx.translate(asteroid.x, asteroid.y); 
                ctx.rotate(asteroid.rotation); 
                ctx.fillStyle = '#8b7355'; 
                ctx.strokeStyle = '#654321'; 
                ctx.lineWidth = 2; 
                ctx.beginPath(); 
                for (let i = 0; i < 8; i++) { 
                    const angle = (Math.PI * 2 / 8) * i; 
                    const radius = asteroid.size + Math.sin(i * 1.5) * 5; 
                    if (i === 0) { 
                        ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius); 
                    } else { 
                        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius); 
                    } 
                } 
                ctx.closePath(); 
                ctx.fill(); 
                ctx.stroke(); 
                ctx.restore(); 
            } 
        }
        
        function drawInvaders() { 
            for (let invader of invaders) { 
                if (!invader.alive) continue; 
                ctx.save(); 
                ctx.translate(invader.x, invader.y); 
                if (invader.type === 'strong') { 
                    ctx.fillStyle = '#ff00ff'; 
                } else { 
                    ctx.fillStyle = '#00ffff'; 
                } 
                ctx.fillRect(-20, -15, 40, 30); 
                ctx.fillStyle = '#000'; 
                ctx.fillRect(-10, -10, 5, 5); 
                ctx.fillRect(5, -10, 5, 5); 
                ctx.strokeStyle = invader.type === 'strong' ? '#ff00ff' : '#00ffff'; 
                ctx.lineWidth = 3; 
                for (let i = 0; i < 3; i++) { 
                    ctx.beginPath(); 
                    ctx.moveTo(-15 + i * 15, 15); 
                    ctx.lineTo(-15 + i * 15, 25 + Math.sin(Date.now() * 0.01 + i) * 5); 
                    ctx.stroke(); 
                } 
                ctx.restore(); 
            } 
        }

        function drawTreasureChests() {
            for (let chest of treasureChests) {
                if (!chest.alive) continue;
                ctx.save();
                ctx.translate(chest.x, chest.y);
                
                // Draw chest body
                const gradient = ctx.createLinearGradient(-30, -25, 30, 25);
                gradient.addColorStop(0, '#8B4513');
                gradient.addColorStop(0.5, '#A0522D');
                gradient.addColorStop(1, '#654321');
                ctx.fillStyle = gradient;
                ctx.fillRect(-30, -15, 60, 40);
                
                // Draw chest lid
                ctx.fillStyle = '#654321';
                ctx.fillRect(-30, -25, 60, 15);
                
                // Draw gold trim
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.strokeRect(-30, -25, 60, 40);
                
                // Draw lock
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw coin value
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = '#ffd700';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeText(chest.value, -10, -35);
                ctx.fillText(chest.value, -10, -35);
                
                ctx.restore();
            }
        }

        function drawCoinParticles() {
            for (let particle of coinParticles) {
                particle.draw();
            }
        }
        
        function drawStars() { 
            ctx.fillStyle = '#fff'; 
            for (let star of stars) { 
                ctx.globalAlpha = Math.random() * 0.5 + 0.5; 
                ctx.fillRect(star.x, star.y, star.size, star.size); 
                star.y += star.speed; 
                if (star.y > canvas.height) { 
                    star.y = 0; 
                    star.x = Math.random() * canvas.width; 
                } 
            } 
            ctx.globalAlpha = 1; 
        }
        
        function drawParticles() { 
            for (let particle of particles) { 
                particle.draw(); 
            } 
        }
        
        function updateScore() { document.getElementById('score').textContent = score; }
        function updateLives() { document.getElementById('lives').textContent = lives; }
        function updateLevel() { document.getElementById('level').textContent = level; }
        function updateCoins() { document.getElementById('coins').textContent = bonusCoins; }
        function updateTimer() { document.getElementById('timer').textContent = bonusTimer; }
        
        function togglePause() {
            if (gameState !== 'playing' && gameState !== 'paused') return;
            if (gameState === 'playing') {
                gameState = 'paused';
                cancelAnimationFrame(animationId);
                pauseScreen.style.display = 'flex';
                pauseBtn.innerHTML = '▶';
            } else {
                gameState = 'playing';
                pauseScreen.style.display = 'none';
                pauseBtn.innerHTML = '❚❚';
                gameLoop();
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            muteBtn.innerHTML = isMuted ? '🔇' : '🔊';
        }

        function nextLevel() {
            level++;
            updateLevel();
            
            // Check if it's bonus level time (every 3 levels)
            if (level % 3 === 0) {
                startBonusLevel();
            } else {
                // Normal level progression
                invaderSpeed += 0.2;
                invaderShootRate += 0.0003;
                asteroidSpawnRate += 0.003;
                enemyBulletSpeed += 0.2;
                
                // Apply shield if purchased
                if (hasShield) {
                    shieldActive = true;
                    shieldTimer = 600; // 10 seconds at 60fps
                }
                
                levelUpScreen.innerHTML = `LEVEL ${level}`;
                levelUpScreen.style.display = 'block';
                setTimeout(() => { levelUpScreen.style.display = 'none'; }, 2000);
                
                playSound(600, 0.4, 'triangle');
                createInvaders();
            }
        }

        function startBonusLevel() {
            isBonusLevel = true;
            bonusCoins = 0;
            bonusTimer = 10;
            
            // Clear regular enemies
            invaders.length = 0;
            asteroids.length = 0;
            enemyBullets.length = 0;
            
            // Show bonus level message
            bonusLevelScreen.innerHTML = '💰 BONUS LEVEL 💰';
            bonusLevelScreen.style.display = 'block';
            setTimeout(() => { bonusLevelScreen.style.display = 'none'; }, 2000);
            
            // Show coin and timer panels
            coinsPanel.style.display = 'block';
            timerPanel.style.display = 'block';
            
            updateCoins();
            updateTimer();
            
            // Create treasure chests
            createTreasureChests();
            
            // Start timer
            bonusInterval = setInterval(() => {
                bonusTimer--;
                updateTimer();
                if (bonusTimer <= 0) {
                    clearInterval(bonusInterval);
                }
            }, 1000);
            
            playSound(1200, 0.5, 'sine');
        }

        function endBonusLevel() {
            isBonusLevel = false;
            clearInterval(bonusInterval);
            
            // Hide bonus UI
            coinsPanel.style.display = 'none';
            timerPanel.style.display = 'none';
            
            // Show shop
            showShop();
        }

        function showShop() {
            gameState = 'shopping';
            cancelAnimationFrame(animationId);
            
            document.getElementById('shopCoins').textContent = bonusCoins;
            shopScreen.style.display = 'flex';
            
            // Reset quantities
            shopItems.life.quantity = 0;
            shopItems.shield.quantity = 0;
            updateShopDisplay();
        }

        function changeQuantity(item, change) {
            const newQuantity = shopItems[item].quantity + change;
            const totalCost = calculateTotalCost() + (change > 0 ? shopItems[item].price : -shopItems[item].price);
            
            if (newQuantity >= 0 && totalCost <= bonusCoins) {
                shopItems[item].quantity = newQuantity;
                updateShopDisplay();
            }
        }

        function calculateTotalCost() {
            return shopItems.life.quantity * shopItems.life.price + 
                   shopItems.shield.quantity * shopItems.shield.price;
        }

        function updateShopDisplay() {
            document.getElementById('lifeQuantity').textContent = shopItems.life.quantity;
            document.getElementById('shieldQuantity').textContent = shopItems.shield.quantity;
        }

        function finishShopping() {
            // Apply purchases
            lives += shopItems.life.quantity;
            updateLives();
            
            if (shopItems.shield.quantity > 0) {
                hasShield = true;
            }
            
            // Hide shop
            shopScreen.style.display = 'none';
            
            // Continue to next level
            gameState = 'playing';
            level++;
            updateLevel();
            
            // Apply shield immediately if purchased
            if (hasShield) {
                shieldActive = true;
                shieldTimer = 600; // 10 seconds at 60fps
            }
            
            levelUpScreen.innerHTML = `LEVEL ${level}`;
            levelUpScreen.style.display = 'block';
            setTimeout(() => { levelUpScreen.style.display = 'none'; }, 2000);
            
            createInvaders();
            gameLoop();
        }

        function gameLoop() {
            if (gameState !== 'playing') return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawStars();
            
            updatePlayer();
            updateBullets();
            updateParticles();
            updateCoinParticles();
            
            if (isBonusLevel) {
                updateTreasureChests();
                drawTreasureChests();
            } else {
                updateEnemyBullets();
                updateAsteroids();
                updateInvaders();
                updateShield();
                drawAsteroids();
                drawInvaders();
                
                if (Math.random() < asteroidSpawnRate) {
                    createAsteroid();
                }
            }
            
            drawPlayer();
            drawBullets();
            drawParticles();
            drawCoinParticles();
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function startGame() {
            gameState = 'playing';
            score = 0;
            lives = 3;
            level = 1;
            invaderSpeed = 1;
            invaderShootRate = 0.001;
            asteroidSpawnRate = 0.02;
            enemyBulletSpeed = 3;
            isBonusLevel = false;
            hasShield = false;
            shieldActive = false;
            
            bullets.length = 0;
            enemyBullets.length = 0;
            asteroids.length = 0;
            particles.length = 0;
            treasureChests.length = 0;
            coinParticles.length = 0;
            
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            
            updateScore();
            updateLives();
            updateLevel();
            createInvaders();
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            pauseScreen.style.display = 'none';
            shopScreen.style.display = 'none';
            coinsPanel.style.display = 'none';
            timerPanel.style.display = 'none';
            pauseBtn.style.display = 'flex';
            pauseBtn.innerHTML = '❚❚';
            
            gameLoop();
        }
        
        function gameOver() {
            gameState = 'gameOver';
            cancelAnimationFrame(animationId);
            clearInterval(bonusInterval);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
            pauseBtn.style.display = 'none';
        }
        
        function restartGame() { startGame(); }
        
        // Initial setup
        drawStars();
        pauseBtn.style.display = 'none';
    </script>
</body>
</html>
