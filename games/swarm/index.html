<!doctype html>
<meta charset="utf-8">
<title>SWARM</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d17}
  canvas{display:block;cursor:crosshair}
  #test{color:#cfd;font:13px/1.6 ui-monospace,Consolas,monospace;padding:20px;white-space:pre}
  /* Native form controls on an HTML overlay, not a canvas-drawn menu: keyboard nav,
     focus rings, screen-reader labels and touch all come free. */
  #panel{position:fixed;top:0;right:0;width:320px;height:100vh;box-sizing:border-box;
    overflow-y:auto;background:#0b0d17;border-left:1px solid #2a3350;color:#dfe;
    font:13px/1.5 ui-monospace,Consolas,monospace;padding:16px 18px 60px;z-index:10}
  #panel[hidden]{display:none}
  #panel h2{font-size:13px;margin:0;color:#4ecdc4;letter-spacing:.1em}
  #panel h3{font-size:11px;margin:18px 0 2px;color:#7d89a6;letter-spacing:.12em;
    border-top:1px solid #212840;padding-top:12px}
  #panel .k{margin:9px 0}
  #panel label{display:flex;justify-content:space-between;gap:10px;margin-bottom:2px;cursor:pointer}
  #panel .v{color:#ffd479;flex:none}
  #panel input[type=range]{width:100%;accent-color:#4ecdc4;margin:2px 0}
  #panel input[type=checkbox]{accent-color:#4ecdc4;width:15px;height:15px;cursor:pointer}
  #panel small{color:#69748f;display:block;margin-top:1px;line-height:1.35}
  #panel button{background:#1a2038;color:#dfe;border:1px solid #2a3350;padding:6px 11px;
    font:inherit;cursor:pointer;border-radius:3px;margin:14px 6px 0 0}
  #panel button:hover{border-color:#4ecdc4;color:#fff}
  #panel .close{position:absolute;top:12px;right:14px;margin:0;padding:2px 8px;line-height:1.3}
  #panel .foot{color:#69748f;margin-top:18px;border-top:1px solid #212840;padding-top:10px}
  /* Main menu: same HTML-over-canvas approach as the panel, so the buttons are real
     buttons -- tab order, Enter/Space activation and focus rings all come free.
     Lower z-index than the panel, so Settings opens on top of the menu. */
  #menu{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:rgba(6,8,16,.93);color:#dfe;font:13px/1.6 ui-monospace,Consolas,monospace}
  #menu[hidden]{display:none}
  #menu .mwrap{width:min(460px,90vw);text-align:center}
  #menu h1{font-size:64px;margin:0 0 8px;color:#4ee1d0;letter-spacing:.14em}
  #menu .tag{color:#8894ad;margin:0}
  #menu .best{color:#ffd479;margin:14px 0 0;min-height:1.6em}
  #menu .mbtns{display:flex;gap:12px;justify-content:center;margin:20px 0 0}
  #menu button{background:#141a2c;color:#dfe;border:1px solid #2a3350;padding:11px 28px;
    font:inherit;font-size:15px;cursor:pointer;border-radius:4px}
  #menu button:hover{border-color:#4ecdc4;color:#fff}
  #menu button:focus-visible{outline:2px solid #4ecdc4;outline-offset:3px}
  #menu #m-play{border-color:#4ecdc4;color:#4ee1d0}
  #menu details{margin-top:24px;text-align:left;border-top:1px solid #212840;padding-top:14px}
  #menu summary{cursor:pointer;color:#9ddfff;text-align:center}
  #menu ul{margin:12px 0 0;padding-left:20px;color:#8894ad}
  #menu li{margin:4px 0}
</style>
<canvas id="c"></canvas>
<div id="panel" hidden aria-label="Settings and tuning"></div>
<div id="menu" hidden></div>
<script>
// ===== SWARM =====
// A bullet heaven, generated by Claude (Opus 5) in Claude Code.
// One file, no deps, no build step.
// Order: utils - sound - data - state - update - render - input/boot - self-test
// Open ?test in the URL to run the logic asserts.

// ---------- utils ----------
var TAU = Math.PI * 2;
var rnd = function (a, b) { if (a === undefined) a = 1; if (b === undefined) b = 0; return b + Math.random() * (a - b); };
var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
var clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
var dist2 = function (a, b) { var dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
var overlaps = function (a, b) { var s = a.r + b.r; return dist2(a, b) < s * s; };
var nearest = function (from, list) {
  var best = null, bd = Infinity;
  for (var i = 0; i < list.length; i++) {
    if (list[i].dead) continue;
    var d = dist2(from, list[i]);
    if (d < bd) { bd = d; best = list[i]; }
  }
  return best;
};
var mmss = function (t) {
  var m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
};
// XP needed to go from lvl to lvl+1. Strictly increasing (asserted in self-test).
// Tuned flat on purpose: a bullet heaven is only fun if upgrades arrive constantly.
var XP_BASE = 4, XP_STEP = 3;
var xpForLevel = function (lvl) { return XP_BASE + lvl * XP_STEP; };

// ---------- settings ----------
// Screen shake is adjustable down to zero on purpose: motion like this is a genuine
// accessibility problem, and "turn it off" should not require editing the source.
var VOLUME = 0.8, SHAKE_SCALE = 1, SHOW_DMG = true;

// ---------- sound ----------
// ponytail: 20 lines of WebAudio instead of an audio lib. No files to load, no licence to read.
var actx = null;
function snd(freq, dur, type, vol, slide) {
  if (!actx || VOLUME <= 0) return;
  dur = dur || 0.08; vol = (vol || 0.04) * VOLUME;
  var o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, now);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + dur);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now + dur);
}

// ---------- data: enemies ----------
var ETYPES = {
  grunt:   { r: 11, hp: 10,   speed: 52,  dmg: 8,  xp: 1,  c: '#ff5566', sides: 0 },
  runner:  { r: 8,  hp: 6,    speed: 112, dmg: 6,  xp: 1,  c: '#ffaa44', sides: 3 },
  tank:    { r: 19, hp: 52,   speed: 33,  dmg: 17, xp: 6,  c: '#aa66ff', sides: 4 },
  shooter: { r: 12, hp: 18,   speed: 38,  dmg: 6,  xp: 4,  c: '#3ddc4f', sides: 6, shoot: 2.2 },
  splitter:{ r: 16, hp: 30,   speed: 46,  dmg: 12, xp: 3,  c: '#dfe64a', sides: 8, splits: 2 },
  // shard is never in a spawn pool; it only exists because a splitter died
  shard:   { r: 8,  hp: 9,    speed: 94,  dmg: 6,  xp: 1,  c: '#dfe64a', sides: 8 },
  boss:    { r: 46, hp: 3000, speed: 128, dmg: 22, xp: 90, c: '#ff33dd', sides: 0, shoot: 1.45, boss: 1 }
};
var BOSS_T = 180;     // boss arrives at 3:00
var HEART_CHANCE = 0.014;   // per kill
var IFRAMES = 0.55;   // player invulnerability window after a hit

// The entire "level design" of the game: who can spawn, how often, how tough.
function spawnPool(t) {
  var p = ['grunt'];
  if (t > 25)  p.push('runner');
  if (t > 60)  p.push('runner', 'tank');
  if (t > 80)  p.push('splitter');
  if (t > 100) p.push('shooter');
  if (t > 150) p.push('runner', 'tank', 'shooter', 'splitter');
  return p;
}
var SPAWN_RAMP = 140, BATCH_RAMP = 130, HP_RAMP = 96;
function spawnEvery(t) { return 1.0 / (1 + t / SPAWN_RAMP); }
function batchSize(t) { return 1 + Math.floor(t / BATCH_RAMP); }
function hpScale(t) { return 1 + t / HP_RAMP; }
// ponytail: hard population cap instead of a spawn-budget model. Caps the frame cost AND
// stops a wall of enemies forming when the player's dps falls behind. Raise if it feels sparse.
var MAX_ENEMIES = 340;

// ---------- data: weapons ----------
function bullet(o) {
  return {
    x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0, r: o.r, dmg: o.dmg, life: o.life,
    pierce: o.pierce === undefined ? 1 : o.pierce,
    grow: o.grow || 0, foe: !!o.foe, c: o.c || '#8ef', orbit: o.orbit || null, hit: null
  };
}
var WEAPONS = {
  bolt: {
    name: 'Bolt', desc: 'Seeking shot at the nearest enemy. Pierces more as it levels.', cd: 0.5, max: 8,
    evo: { passive: 'extra', into: 'railgun' },
    fire: function (S, w) {
      var n = nearest(S.player, S.enemies);
      if (!n) return;
      var count = 1 + Math.floor((w.lvl - 1) / 2) + S.stats.extra;
      var base = Math.atan2(n.y - S.player.y, n.x - S.player.x);
      for (var i = 0; i < count; i++) {
        var a = base + (i - (count - 1) / 2) * 0.16;
        S.bullets.push(bullet({
          x: S.player.x, y: S.player.y, vx: Math.cos(a) * 540, vy: Math.sin(a) * 540,
          r: 5 * S.stats.area, dmg: (8 + w.lvl * 4.2) * S.stats.dmg, life: 1.4, c: '#9ddfff',
          pierce: 1 + Math.floor(w.lvl / 3)
        }));
      }
      snd(820, 0.05, 'square', 0.022, -320);
    }
  },
  spread: {
    name: 'Scatter', desc: 'Shotgun blast in the way you are moving.', cd: 1.15, max: 8,
    evo: { passive: 'dmg', into: 'flak' },
    fire: function (S, w) {
      var count = 4 + w.lvl + S.stats.extra;
      var base = Math.atan2(S.player.aim.y, S.player.aim.x);
      for (var i = 0; i < count; i++) {
        var a = base + rnd(0.45, -0.45), sp = rnd(520, 380);
        S.bullets.push(bullet({
          x: S.player.x, y: S.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 4 * S.stats.area, dmg: (6 + w.lvl * 2.8) * S.stats.dmg, life: 0.5, c: '#ffd479'
        }));
      }
      snd(300, 0.09, 'sawtooth', 0.028, -180);
    }
  },
  orbit: {
    // ponytail: orbs are ordinary bullets with an orbit param, so they reuse the whole collision path.
    name: 'Halo', desc: 'Orbs circle you and grind whatever they touch.', cd: 2.4, max: 8,
    evo: { passive: 'area', into: 'eventhorizon' },
    fire: function (S, w) {
      var count = 2 + Math.floor(w.lvl / 2) + S.stats.extra;
      for (var i = 0; i < count; i++) {
        S.bullets.push(bullet({
          x: S.player.x, y: S.player.y, r: 9 * S.stats.area,
          dmg: (9 + w.lvl * 4.5) * S.stats.dmg, life: 2.7, pierce: Infinity, c: '#7ef0ff',
          orbit: { a: (i / count) * TAU, rad: 62 + w.lvl * 4, spin: 2.6 }
        }));
      }
    }
  },
  nova: {
    name: 'Nova', desc: 'Shockwave ring that expands out of you.', cd: 2.8, max: 8,
    evo: { passive: 'cd', into: 'singularity' },
    fire: function (S, w) {
      S.bullets.push(bullet({
        x: S.player.x, y: S.player.y, r: 14, grow: 300 + w.lvl * 26,
        dmg: (14 + w.lvl * 8) * S.stats.dmg, life: 0.62, pierce: Infinity, c: '#c9a2ff'
      }));
      snd(150, 0.28, 'sine', 0.045, 420);
    }
  },
  whip: {
    name: 'Lash', desc: 'Wide melee swipe in your facing direction.', cd: 0.95, max: 8,
    evo: { passive: 'spd', into: 'reaper' },
    fire: function (S, w) {
      var a = Math.atan2(S.player.aim.y, S.player.aim.x), reach = 48 + w.lvl * 5;
      S.bullets.push(bullet({
        x: S.player.x + Math.cos(a) * reach, y: S.player.y + Math.sin(a) * reach,
        r: (30 + w.lvl * 3.4) * S.stats.area, dmg: (12 + w.lvl * 6) * S.stats.dmg,
        life: 0.13, pierce: Infinity, c: '#ffffff'
      }));
      snd(180, 0.06, 'triangle', 0.028, 260);
    }
  },

  // ===== evolved forms =====
  // hidden: never offered as a new weapon. max: 1 so they are never offered a level up either.
  // They exist only as the target of an 'evo' card.
  railgun: {
    name: 'Railgun', hidden: true, max: 1, cd: 0.62,
    desc: 'BOLT EVOLVED. A lance that punches through the entire screen.',
    fire: function (S, w) {
      var n = nearest(S.player, S.enemies); if (!n) return;
      var count = 2 + S.stats.extra;
      var base = Math.atan2(n.y - S.player.y, n.x - S.player.x);
      for (var i = 0; i < count; i++) {
        var a = base + (i - (count - 1) / 2) * 0.09;
        S.bullets.push(bullet({
          x: S.player.x, y: S.player.y, vx: Math.cos(a) * 920, vy: Math.sin(a) * 920,
          r: 9 * S.stats.area, dmg: 72 * S.stats.dmg, life: 1.1, pierce: Infinity, c: '#eaffff'
        }));
      }
      snd(1150, 0.09, 'sawtooth', 0.03, -760);
    }
  },
  flak: {
    name: 'Flak', hidden: true, max: 1, cd: 1.0,
    desc: 'SCATTER EVOLVED. A wall of piercing shrapnel.',
    fire: function (S, w) {
      var base = Math.atan2(S.player.aim.y, S.player.aim.x);
      for (var i = 0; i < 14 + S.stats.extra * 3; i++) {
        var a = base + rnd(0.62, -0.62), sp = rnd(660, 430);
        S.bullets.push(bullet({
          x: S.player.x, y: S.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 5 * S.stats.area, dmg: 26 * S.stats.dmg, life: 0.62, pierce: 3, c: '#ffe08a'
        }));
      }
      snd(240, 0.12, 'sawtooth', 0.035, -160);
    }
  },
  eventhorizon: {
    name: 'Event Horizon', hidden: true, max: 1, cd: 2.2,
    desc: 'HALO EVOLVED. A wide ring of heavy orbs that shreds anything close.',
    fire: function (S, w) {
      var count = 6 + S.stats.extra;
      for (var i = 0; i < count; i++) {
        S.bullets.push(bullet({
          x: S.player.x, y: S.player.y, r: 15 * S.stats.area,
          dmg: 46 * S.stats.dmg, life: 2.3, pierce: Infinity, c: '#b8f6ff',
          orbit: { a: (i / count) * TAU, rad: 108, spin: 3.4 }
        }));
      }
      snd(320, 0.14, 'sine', 0.03, 180);
    }
  },
  singularity: {
    name: 'Singularity', hidden: true, max: 1, cd: 2.4,
    desc: 'NOVA EVOLVED. Twin shockwaves that clear the screen.',
    fire: function (S, w) {
      for (var i = 0; i < 2; i++) {
        S.bullets.push(bullet({
          x: S.player.x, y: S.player.y, r: 14 + i * 70, grow: 640,
          dmg: 78 * S.stats.dmg, life: 0.8, pierce: Infinity, c: '#e0b3ff'
        }));
      }
      snd(105, 0.42, 'sine', 0.06, 540);
    }
  },
  reaper: {
    name: 'Reaper', hidden: true, max: 1, cd: 0.8,
    desc: 'LASH EVOLVED. A full circle sweep, every time.',
    fire: function (S, w) {
      S.bullets.push(bullet({
        x: S.player.x, y: S.player.y, r: 96 * S.stats.area, grow: 190,
        dmg: 54 * S.stats.dmg, life: 0.3, pierce: Infinity, c: '#ffffff'
      }));
      snd(150, 0.1, 'triangle', 0.035, 300);
    }
  }
};

// ---------- data: passives ----------
var PASSIVES = {
  dmg:   { name: 'Sharpen',   desc: '+20% damage',          max: 5, apply: function (S) { S.stats.dmg *= 1.2; } },
  cd:    { name: 'Overclock', desc: '-12% cooldowns',       max: 5, apply: function (S) { S.stats.cd *= 0.88; } },
  spd:   { name: 'Sprint',    desc: '+12% move speed',      max: 5, apply: function (S) { S.player.speed *= 1.12; } },
  hp:    { name: 'Plating',   desc: '+25 max HP, heal 25',  max: 5, apply: function (S) { S.player.maxhp += 25; S.player.hp += 25; } },
  mag:   { name: 'Magnet',    desc: '+45% pickup range',    max: 5, apply: function (S) { S.player.magnet *= 1.45; } },
  area:  { name: 'Bloom',     desc: '+18% projectile size', max: 5, apply: function (S) { S.stats.area *= 1.18; } },
  extra: { name: 'Multishot', desc: '+1 projectile',        max: 3, apply: function (S) { S.stats.extra += 1; } },
  regen: { name: 'Mending',   desc: '+0.6 HP per second',   max: 3, apply: function (S) { S.stats.regen += 0.6; } },
  crit:  { name: 'Killer Instinct', desc: '+8% critical chance', max: 5, apply: function (S) { S.stats.crit += 0.08; } }
};

// A weapon evolves once it hits EVO_WEAPON_LVL and its paired passive hits EVO_PASSIVE_LVL.
// Deliberately reachable inside a normal 3-minute run -- an evolution you never see is not a mechanic.
var EVO_WEAPON_LVL = 4, EVO_PASSIVE_LVL = 2;

// ---------- tunables ----------
// Every entry is live: changing it takes effect in the running game, no restart.
var TUNABLES = [
  { g: 'Feel', key: 'volume', label: 'Volume', min: 0, max: 1, step: 0.05,
    get: function () { return VOLUME; }, set: function (v) { VOLUME = v; }, pct: true },
  { g: 'Feel', key: 'shake', label: 'Screen shake', min: 0, max: 1.5, step: 0.05,
    get: function () { return SHAKE_SCALE; }, set: function (v) { SHAKE_SCALE = v; }, pct: true,
    help: 'set to 0 to remove all camera motion' },
  { g: 'Feel', key: 'dmgnum', label: 'Damage numbers', type: 'bool',
    get: function () { return SHOW_DMG; }, set: function (v) { SHOW_DMG = v; } },

  { g: 'Difficulty', key: 'spawnRamp', label: 'Spawn ramp', min: 40, max: 400, step: 5,
    get: function () { return SPAWN_RAMP; }, set: function (v) { SPAWN_RAMP = v; },
    help: 'higher = waves speed up more slowly' },
  { g: 'Difficulty', key: 'batchRamp', label: 'Batch ramp', min: 40, max: 400, step: 5,
    get: function () { return BATCH_RAMP; }, set: function (v) { BATCH_RAMP = v; },
    help: 'higher = fewer enemies per wave' },
  { g: 'Difficulty', key: 'hpRamp', label: 'Enemy HP ramp', min: 30, max: 400, step: 2,
    get: function () { return HP_RAMP; }, set: function (v) { HP_RAMP = v; },
    help: 'higher = enemies stay squishy longer' },
  { g: 'Difficulty', key: 'maxEnemies', label: 'Population cap', min: 40, max: 900, step: 10,
    get: function () { return MAX_ENEMIES; }, set: function (v) { MAX_ENEMIES = v; } },
  { g: 'Difficulty', key: 'bossAt', label: 'Boss at', min: 30, max: 600, step: 10,
    get: function () { return BOSS_T; }, set: function (v) { BOSS_T = v; }, secs: true },
  { g: 'Difficulty', key: 'iframes', label: 'Hit forgiveness', min: 0.1, max: 2, step: 0.05,
    get: function () { return IFRAMES; }, set: function (v) { IFRAMES = v; }, secs: true,
    help: 'invulnerable time after taking a hit' },

  { g: 'Progression', key: 'xpStep', label: 'XP curve', min: 1, max: 20, step: 1,
    get: function () { return XP_STEP; }, set: function (v) { XP_STEP = v; },
    help: 'higher = levels come more slowly' },
  { g: 'Progression', key: 'heart', label: 'Heart drop', min: 0, max: 0.15, step: 0.002,
    get: function () { return HEART_CHANCE; }, set: function (v) { HEART_CHANCE = v; }, pct: true },
  { g: 'Progression', key: 'evoW', label: 'Evolve: weapon lvl', min: 1, max: 8, step: 1,
    get: function () { return EVO_WEAPON_LVL; }, set: function (v) { EVO_WEAPON_LVL = v; } },
  { g: 'Progression', key: 'evoP', label: 'Evolve: passive lvl', min: 1, max: 5, step: 1,
    get: function () { return EVO_PASSIVE_LVL; }, set: function (v) { EVO_PASSIVE_LVL = v; } }
];
var TUNE_DEFAULTS = (function () {
  var d = {};
  for (var i = 0; i < TUNABLES.length; i++) d[TUNABLES[i].key] = TUNABLES[i].get();
  return d;
})();
function findTunable(key) {
  for (var i = 0; i < TUNABLES.length; i++) if (TUNABLES[i].key === key) return TUNABLES[i];
  return null;
}
function resetTunables() {
  for (var i = 0; i < TUNABLES.length; i++) TUNABLES[i].set(TUNE_DEFAULTS[TUNABLES[i].key]);
}
function tuningToJSON() {
  var o = {};
  for (var i = 0; i < TUNABLES.length; i++) o[TUNABLES[i].key] = TUNABLES[i].get();
  return o;
}
function applyTuning(o) {
  if (!o) return;
  for (var i = 0; i < TUNABLES.length; i++) {
    var t = TUNABLES[i];
    if (!(t.key in o)) continue;
    var v = o[t.key];
    if (t.type === 'bool') { t.set(!!v); continue; }
    v = Number(v);
    if (!isFinite(v)) continue;                 // never let a corrupt save poison a knob
    t.set(clamp(v, t.min, t.max));
  }
}
function saveTuning() { try { localStorage.setItem('swarm.tuning', JSON.stringify(tuningToJSON())); } catch (e) { } }
function loadTuning() { try { applyTuning(JSON.parse(localStorage.getItem('swarm.tuning'))); } catch (e) { } }

// ---------- state ----------
var S = null, canvas = null, ctx = null, eid = 1;

function loadBest() {
  try { return JSON.parse(localStorage.getItem('swarm.best')) || { t: 0, kills: 0 }; }
  catch (e) { return { t: 0, kills: 0 }; }
}
function saveBest(S) {
  var b = loadBest();
  if (S.t > b.t) b = { t: S.t, kills: S.kills };
  try { localStorage.setItem('swarm.best', JSON.stringify(b)); } catch (e) { }
  return b;
}

function newGame(mode) {
  S = {
    t: 0, mode: mode || 'play', kills: 0, shake: 0, hitstop: 0, pending: 0, cards: [],
    player: {
      x: 0, y: 0, r: 12, hp: 100, maxhp: 100, speed: 172,
      xp: 0, level: 1, xpNext: xpForLevel(1), ifr: 0, magnet: 95, aim: { x: 1, y: 0 }
    },
    enemies: [], bullets: [], gems: [], parts: [], texts: [],

// ---------- upgrades ----------

  return null;
}
function upgradePool(S) {
  var pool = [], k, w, lvl;
  for (k in WEAPONS) {

    w = findWeapon(S, k);
    if (w) {
      if (w.lvl < WEAPONS[k].max) pool.push({ kind: 'wlvl', key: k, title: WEAPONS[k].name + ' Lv' + (w.lvl + 1), desc: WEAPONS[k].desc });
    } else if (S.weapons.length < 5) {
      pool.push({ kind: 'wnew', key: k, title: 'NEW  ' + WEAPONS[k].name, desc: WEAPONS[k].desc });
    }
  }
  for (k in PASSIVES) {
    lvl = S.passives[k] || 0;
    if (lvl < PASSIVES[k].max) pool.push({ kind: 'pass', key: k, title: PASSIVES[k].name + ' Lv' + (lvl + 1), desc: PASSIVES[k].desc });
  }

    if ((S.passives[spec.evo.passive] || 0) < EVO_PASSIVE_LVL) continue;
    pool.push({
      kind: 'evo', key: own.key, into: spec.evo.into,

    if (pool[i].kind === "evo") out.push(pool.splice(i, 1)[0]);
  }
  // splice-without-replacement, so the three cards are always distinct
  while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  while (out.length < 3) out.push({ kind: 'heal', key: 'heal', title: 'Field Repair', desc: 'Heal 40 HP' });
  return out;
}
function applyUpgrade(S, c) {
  if (c.kind === 'wnew') S.weapons.push({ key: c.key, lvl: 1, t: 0 });
  else if (c.kind === 'evo') {
    var ow = findWeapon(S, c.key);
    ow.key = c.into; ow.lvl = 1; ow.t = 0;   // the slot is reused, so the loadout never grows

function chooseCard(i) {

  applyUpgrade(S, S.cards[i]);

}

// ---------- combat ----------
function burst(S, x, y, c, n) {
  for (var i = 0; i < n; i++) {
    var a = rnd(TAU), sp = rnd(240, 40);
    S.parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.55, 0.2), r: rnd(3.5, 1), c: c });
  }
}
function hurtEnemy(S, e, dmg, src) {

  var crit = Math.random() < S.stats.crit;
  if (crit) dmg *= 2.2;
  e.hp -= dmg;
  e.flash = 0.08;
  // ponytail: knockback as a position nudge, not a velocity field -- enemies have no velocity to
  // integrate. At 60fps a small shove reads as a flinch. Divided by size, so a boss barely budges.
  // Keep it well under an enemy's per-second approach speed or crowds stall out and never reach you.

    x: e.x, y: e.y - e.r, txt: String(Math.round(dmg)),
    life: crit ? 0.75 : 0.55, c: crit ? '#ffd166' : '#ffffff', big: crit
  });

    var n = Math.min(e.xp, 10), each = e.xp / n;

    // The only healing in the game. The magnet ignores hearts on purpose: collecting one means
    // walking back into the swarm, which is the only thing that ever pulls you toward danger.
    if (Math.random() < HEART_CHANCE) S.gems.push({ x: e.x, y: e.y, r: 9, xp: 0, heal: 30, c: '#ff6b8a' });
    if (e.splits) for (var j = 0; j < e.splits; j++) {
      var sh = spawnEnemy(S, 'shard');
      sh.x = e.x + rnd(22, -22); sh.y = e.y + rnd(22, -22);
    }
    S.shake = Math.min(16, S.shake + (e.boss ? 16 : 1.4));
    snd(e.boss ? 70 : 220, e.boss ? 0.5 : 0.07, 'sawtooth', e.boss ? 0.09 : 0.022, -120);
    if (e.boss) { S.hitstop = 0.35; S.mode = 'win'; S.best = saveBest(S); }
  }
}
function hurtPlayer(S, dmg) {

  S.player.hp = Math.max(0, S.player.hp - dmg);
  S.player.ifr = IFRAMES;
  S.shake = Math.min(22, S.shake + 9);
  S.hitstop = 0.05;

}
function gainXp(S, amt) {

  while (p.xp >= p.xpNext) { p.xp -= p.xpNext; p.level++; p.xpNext = xpForLevel(p.level); S.pending++; }
  if (S.pending > 0 && S.mode === 'play') {

    S.cards = pickUpgrades(S);

  }
}
function spawnEnemy(S, type) {
  var t = ETYPES[type];
  var vw = canvas ? canvas.width : 1280, vh = canvas ? canvas.height : 720;
  var ring = Math.sqrt(vw * vw + vh * vh) * 0.55 + 40;
  var a = rnd(TAU);
  var hp = t.boss ? t.hp * (1 + S.t / 150) : t.hp * hpScale(S.t);

    id: eid++, type: type, x: S.player.x + Math.cos(a) * ring, y: S.player.y + Math.sin(a) * ring,
    r: t.r, hp: hp, maxhp: hp, speed: t.speed, dmg: t.dmg, xp: t.xp, c: t.c, sides: t.sides,

function enemyShoot(S, e, count) {

      x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,

// ---------- update ----------
var keys = {};
function key(k) { return !!keys[k]; }

function update(dt) {
  S.shake *= Math.pow(0.0015, dt);   // frame-rate independent decay
  var i, j;
  for (i = S.parts.length - 1; i >= 0; i--) {
    var pa = S.parts[i];
    pa.life -= dt; pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vx *= 0.94; pa.vy *= 0.94;
    if (pa.life <= 0) S.parts.splice(i, 1);
  }
  for (i = S.texts.length - 1; i >= 0; i--) {
    var tx = S.texts[i];
    tx.life -= dt; tx.y -= 34 * dt;
    if (tx.life <= 0) S.texts.splice(i, 1);
  }
  if (S.mode !== 'play') return;

  S.t += dt;
  var p = S.player;

  // --- movement ---
  var mx = (key('d') || key('arrowright') ? 1 : 0) - (key('a') || key('arrowleft') ? 1 : 0);
  var my = (key('s') || key('arrowdown') ? 1 : 0) - (key('w') || key('arrowup') ? 1 : 0);
  var len = Math.sqrt(mx * mx + my * my);
  if (len) { mx /= len; my /= len; p.aim.x = mx; p.aim.y = my; }
  p.x += mx * p.speed * dt;
  p.y += my * p.speed * dt;
  if (p.ifr > 0) p.ifr -= dt;
  if (S.stats.regen) p.hp = Math.min(p.maxhp, p.hp + S.stats.regen * dt);

  // --- weapons ---
  for (i = 0; i < S.weapons.length; i++) {
    var w = S.weapons[i];
    w.t -= dt;
    if (w.t <= 0) { WEAPONS[w.key].fire(S, w); w.t = WEAPONS[w.key].cd * S.stats.cd; }
  }

  // --- spawning ---
  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    S.spawnT = spawnEvery(S.t) * (S.bossSpawned ? 2.2 : 1);
    var pool = spawnPool(S.t), n = batchSize(S.t);
    for (i = 0; i < n && S.enemies.length < MAX_ENEMIES; i++) spawnEnemy(S, pick(pool));
  }
  if (!S.bossSpawned && S.t >= BOSS_T) {
    S.bossSpawned = true;
    spawnEnemy(S, 'boss');
    S.bullets = S.bullets.filter(function (b) { return !b.foe; });
    S.shake = 18;

  }

  // --- enemies ---

    var e = S.enemies[i];

    var dx = p.x - e.x, dy = p.y - e.y, d = Math.sqrt(dx * dx + dy * dy) || 1;

    }

  // --- bullets ---
  // ponytail: O(bullets x enemies) brute force. ~60 x 300 = 18k checks a frame, well inside budget.
  // If it ever isn't: uniform grid hash keyed on x>>6, y>>6.
  for (i = S.bullets.length - 1; i >= 0; i--) {

      b.y = p.y + Math.sin(b.orbit.a) * b.orbit.rad;

      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    if (b.grow) b.r += b.grow * dt;

    if (b.foe) {

    }

      if (g.heal) {

        snd(560, 0.16, 'sine', 0.05, 260);
      } else {

    }
  }
}

// ---------- render ----------
function shape(x, y, r, sides, rot) {

    var a = rot + i / sides * TAU, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);

}
function bar(x, y, w, h, frac, fg, bg) {

}
function cardRects() {

}

}

function draw() {
  var W = canvas.width, H = canvas.height, p = S.player, i;
  ctx.fillStyle = '#0b0d17';
  ctx.fillRect(0, 0, W, H);

  var camx = p.x - W / 2, camy = p.y - H / 2;
  var sx = S.shake > 0.15 ? rnd(S.shake, -S.shake) * SHAKE_SCALE : 0;
  var sy = S.shake > 0.15 ? rnd(S.shake, -S.shake) * SHAKE_SCALE : 0;

  for (i = 0; i < S.gems.length; i++) {
    var g = S.gems[i];
    ctx.fillStyle = g.c;
    if (g.heal) {

      ctx.moveTo(g.x, g.y - 4); ctx.lineTo(g.x, g.y + 4);
      ctx.stroke();
    } else {

    }
  }

  // enemies
  for (i = 0; i < S.enemies.length; i++) {
    var e = S.enemies[i];
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.c;
    shape(e.x, e.y, e.r, e.sides, S.t * 0.8 + e.id); ctx.fill();
    if (e.boss) {
      ctx.strokeStyle = '#ff9be8'; ctx.lineWidth = 3;
      shape(e.x, e.y, e.r + 10, 0, 0); ctx.stroke();
    }
  }

  // bullets
  for (i = 0; i < S.bullets.length; i++) {
    var b = S.bullets[i];
    if (b.grow) {
      ctx.strokeStyle = b.c; ctx.lineWidth = 5; ctx.globalAlpha = clamp(b.life * 2, 0, 1);

    } else {
      ctx.fillStyle = b.c;
      ctx.globalAlpha = b.life < 0.2 ? b.life * 5 : 1;
      shape(b.x, b.y, b.r, 0, 0); ctx.fill();
      if (b.foe) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.globalAlpha = 1;

  ctx.fillStyle = '#4ee1d0';
  shape(p.x, p.y, p.r, 0, 0); ctx.fill();
  // you must never lose track of yourself in the crowd
  ctx.strokeStyle = '#eafffb'; ctx.lineWidth = 2;
  shape(p.x, p.y, p.r + 4, 0, 0); ctx.stroke();
  ctx.strokeStyle = '#0b0d17'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + p.aim.x * p.r, p.y + p.aim.y * p.r); ctx.stroke();
  ctx.globalAlpha = 1;

  // particles
  for (i = 0; i < S.parts.length; i++) {
    var pa = S.parts[i];
    ctx.globalAlpha = clamp(pa.life * 2.2, 0, 1);
    ctx.fillStyle = pa.c;
    ctx.fillRect(pa.x - pa.r, pa.y - pa.r, pa.r * 2, pa.r * 2);

  for (i = 0; i < S.texts.length; i++) {
    var tx = S.texts[i];
    ctx.globalAlpha = clamp(tx.life * 2, 0, 1);
    ctx.fillStyle = tx.c;
    ctx.font = 'bold ' + (tx.big ? 19 : 13) + 'px ui-monospace,Consolas,monospace';
    ctx.fillText(tx.txt, tx.x, tx.y);

  if (S.mode === 'levelup') drawCards(W, H);
  if (S.mode === 'title') drawTitle(W, H);
  if (S.mode === 'dead') drawEnd(W, H, 'YOU DIED', '#ff5566');

}

function drawHud(W, H) {
  var p = S.player;
  bar(0, 0, W, 7, p.xp / p.xpNext, '#4ecdc4', '#141a2c');

  ctx.font = 'bold 14px ui-monospace,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#9fb';
  ctx.fillText('LV ' + p.level, 14, 30);
  bar(14, 38, 210, 13, p.hp / p.maxhp, p.hp / p.maxhp < 0.3 ? '#ff5566' : '#5ad07a');
  ctx.fillStyle = '#dfe';
  ctx.fillText(Math.ceil(p.hp) + ' / ' + Math.round(p.maxhp), 20, 49);

  ctx.textAlign = 'center';
  ctx.font = 'bold 26px ui-monospace,Consolas,monospace';
  ctx.fillStyle = '#eef';
  ctx.fillText(mmss(S.t), W / 2, 40);

  ctx.textAlign = 'right';
  ctx.font = 'bold 14px ui-monospace,Consolas,monospace';
  ctx.fillStyle = '#9fb';
  ctx.fillText(S.kills + ' kills', W - 14, 30);
  if (!S.bossSpawned) {
    ctx.fillStyle = '#667';
    ctx.fillText('boss in ' + mmss(Math.max(0, BOSS_T - S.t)), W - 14, 50);
  }

  // loadout chips
  ctx.textAlign = 'left';
  ctx.font = '12px ui-monospace,Consolas,monospace';
  var x = 14;
  for (var i = 0; i < S.weapons.length; i++) {
    var w = S.weapons[i], label = WEAPONS[w.key].name + ' ' + w.lvl;
    var tw = ctx.measureText(label).width + 16;
    ctx.fillStyle = '#1a2038';
    ctx.fillRect(x, H - 34, tw, 22);
    ctx.fillStyle = '#8ecfff';
    ctx.fillText(label, x + 8, H - 19);
    x += tw + 8;
  }

  // boss health
  for (var j = 0; j < S.enemies.length; j++) {
    if (!S.enemies[j].boss) continue;
    var e = S.enemies[j];
    bar(W / 2 - 260, 58, 520, 12, e.hp / e.maxhp, '#ff33dd');
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffc9f4';
    ctx.font = 'bold 12px ui-monospace,Consolas,monospace';
    ctx.fillText('THE SWARM MOTHER', W / 2, 84);
    break;
  }
}

function drawCards(W, H) {
  ctx.fillStyle = 'rgba(6,8,16,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#4ecdc4';
  ctx.font = 'bold 30px ui-monospace,Consolas,monospace';
  ctx.fillText('LEVEL ' + S.player.level, W / 2, H / 2 - 190);
  ctx.fillStyle = '#778';
  ctx.font = '13px ui-monospace,Consolas,monospace';
  ctx.fillText('click a card, or press 1 / 2 / 3' + (S.pending > 1 ? '   (' + S.pending + ' pending)' : ''), W / 2, H / 2 - 165);

  var rs = cardRects();
  for (var i = 0; i < 3; i++) {
    var r = rs[i], c = S.cards[i], hov = mouse.x > r.x && mouse.x < r.x + r.w && mouse.y > r.y && mouse.y < r.y + r.h;
    ctx.fillStyle = hov ? '#1d2947' : '#141a2c';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = c.kind === 'evo' ? '#ff8ae0' : hov ? '#4ecdc4' : '#2a3350';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.fillStyle = '#3d4970';
    ctx.font = 'bold 40px ui-monospace,Consolas,monospace';
    ctx.fillText(String(i + 1), r.x + r.w / 2, r.y + 62);

    ctx.fillStyle = c.kind === 'evo' ? '#ff8ae0' : c.kind === 'wnew' ? '#ffd479' : '#9ddfff';
    ctx.font = 'bold 17px ui-monospace,Consolas,monospace';
    var tl = wrap(c.title, r.w - 30);
    for (var k = 0; k < tl.length; k++) ctx.fillText(tl[k], r.x + r.w / 2, r.y + 120 + k * 22);

    ctx.fillStyle = '#8894ad';
    ctx.font = '13px ui-monospace,Consolas,monospace';
    var dl = wrap(c.desc, r.w - 36);
    for (var m = 0; m < dl.length; m++) ctx.fillText(dl[m], r.x + r.w / 2, r.y + 190 + m * 19);
  }
}

// ---------- settings panel ----------
// The game keeps running behind the panel: the whole point of a tuning knob is watching
// the change land. Movement keys are suppressed only while a control has focus.
var panelEl = null, panelBuilt = false;

// BUTTON is included so Enter and Space activate the focused menu button instead of
// being eaten by the game. Anything that hands focus back must call blurUI().
function uiHasFocus() {
  var a = document.activeElement;
  return !!a && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(a.tagName);
}
function fmtTunable(t) {
  var v = t.get();
  if (t.type === 'bool') return v ? 'on' : 'off';
  if (t.pct) return Math.round(v * 100) + '%';
  if (t.secs) return v >= 10 ? mmss(v) : v.toFixed(2) + 's';
  return String(v);
}
function tunableRow(t) {
  var wrap = document.createElement('div');
  wrap.className = 'k';
  var lab = document.createElement('label');
  var name = document.createElement('span');
  name.textContent = t.label;
  var val = document.createElement('span');
  val.className = 'v';
  var inp = document.createElement('input');
  inp.id = 'tune-' + t.key;
  lab.htmlFor = inp.id;
  lab.appendChild(name); lab.appendChild(val);

  if (t.type === 'bool') {
    inp.type = 'checkbox';
    inp.checked = t.get();
    val.appendChild(inp);            // the checkbox sits where the value would be
    wrap.appendChild(lab);
  } else {
    inp.type = 'range';
    inp.min = t.min; inp.max = t.max; inp.step = t.step;
    inp.value = t.get();
    wrap.appendChild(lab); wrap.appendChild(inp);
  }
  t._sync = function () {
    if (t.type === 'bool') inp.checked = t.get(); else inp.value = t.get();
    val.firstChild && val.firstChild.nodeType === 3 ? (val.firstChild.nodeValue = '') : 0;
    if (t.type !== 'bool') val.textContent = fmtTunable(t);
  };
  if (t.type !== 'bool') val.textContent = fmtTunable(t);
  inp.addEventListener('input', function () {
    t.set(t.type === 'bool' ? inp.checked : parseFloat(inp.value));
    if (t.type !== 'bool') val.textContent = fmtTunable(t);
    saveTuning();
  });
  if (t.help) {
    var h = document.createElement('small');
    h.textContent = t.help;
    wrap.appendChild(h);
  }
  return wrap;
}
function buildPanel() {
  panelEl = document.getElementById('panel');
  if (!panelEl || panelBuilt) return;
  panelBuilt = true;

  var head = document.createElement('h2');
  head.textContent = 'SWARM';
  panelEl.appendChild(head);

  var x = document.createElement('button');
  x.className = 'close';
  x.textContent = 'x';
  x.title = 'close (T)';
  x.addEventListener('click', function () { togglePanel(false); });
  panelEl.appendChild(x);

  var group = null;
  for (var i = 0; i < TUNABLES.length; i++) {
    if (TUNABLES[i].g !== group) {
      group = TUNABLES[i].g;
      var h3 = document.createElement('h3');
      h3.textContent = group;
      panelEl.appendChild(h3);
    }
    panelEl.appendChild(tunableRow(TUNABLES[i]));
  }

  var reset = document.createElement('button');
  reset.textContent = 'Reset to defaults';
  reset.addEventListener('click', function () { resetTunables(); syncPanel(); saveTuning(); });
  panelEl.appendChild(reset);

  var restart = document.createElement('button');
  restart.textContent = 'Restart run';
  restart.addEventListener('click', function () { newGame('play'); togglePanel(false); });
  panelEl.appendChild(restart);

  var foot = document.createElement('div');
  foot.className = 'foot';
  foot.textContent = 'T closes this. Changes apply live and are remembered.';
  panelEl.appendChild(foot);
}
function syncPanel() {
  for (var i = 0; i < TUNABLES.length; i++) if (TUNABLES[i]._sync) TUNABLES[i]._sync();
}
function togglePanel(want) {
  if (!panelEl) return;
  var open = want === undefined ? panelEl.hidden : want;
  panelEl.hidden = !open;
  if (open) syncPanel(); else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

// ---------- main menu ----------
var menuEl = null, menuBuilt = false;

function buildMenu() {
  menuEl = document.getElementById('menu');
  if (!menuEl || menuBuilt) return;
  menuBuilt = true;

    '<div class="mwrap">' +
      '<h1>SWARM</h1>' +

// Driven from the frame loop so the menu tracks S.mode no matter what changed it.
// Only touches the DOM on an actual transition, or it would steal focus every frame.
function syncMenu() {
  if (!menuEl) return;
  var show = S.mode === 'title';
  if (menuEl.hidden === !show) return;   // already in the right state
  menuEl.hidden = !show;
  if (!show) return;
  var b = menuEl.querySelector('.best');
  if (b) b.textContent = S.best.t > 0 ? 'best   ' + mmss(S.best.t) + '   ' + S.best.kills + ' kills' : '';
  var play = document.getElementById('m-play');
  if (play) play.focus();
}
function startRun() {
  unlockAudio();
  newGame('play');
  blurUI();   // a still-focused button would swallow the movement keys
}
function toMenu() { newGame('title'); }
function blurUI() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

// ---------- input + boot ----------
var mouse = { x: -1, y: -1 };
function unlockAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
}
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

function onKey(k) {
  unlockAudio();
  if (S.mode === 'title') return;   // the menu's Play button starts the run, not any key
  if (S.mode === 'levelup') {
    if (k === '1') chooseCard(0);
    if (k === '2') chooseCard(1);
    if (k === '3') chooseCard(2);
    return;
  }
  if (S.mode === 'dead' || S.mode === 'win') {
    if (k === 'r') { newGame('play'); return; }
    if (k === 'm') { toMenu(); return; }
  }
  if (k === 'p' || k === 'escape') {
    if (S.mode === 'play') S.mode = 'pause';
    else if (S.mode === 'pause') S.mode = 'play';
  }
}
function onClick() {
  unlockAudio();
  blurUI();   // clicking the world hands the keyboard back to the player
  if (S.mode === 'title') return;   // the menu overlay owns this screen
  if (S.mode === 'dead' || S.mode === 'win') { newGame('play'); return; }
  if (S.mode === 'levelup') {
    var rs = cardRects();
    for (var i = 0; i < 3; i++) {
      var r = rs[i];
      if (mouse.x > r.x && mouse.x < r.x + r.w && mouse.y > r.y && mouse.y < r.y + r.h) { chooseCard(i); return; }
    }
  }
}

var last = 0;
function frame(now) {
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (S.hitstop > 0) S.hitstop -= dt; else update(dt);
  syncMenu();
  draw();
  requestAnimationFrame(frame);
}

function boot() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  resize();
  loadTuning();
  buildPanel();
  buildMenu();
  newGame('title');
  syncMenu();   // correct before the first frame, not one frame later
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', function (ev) {
    var k = ev.key.toLowerCase();
    if (k === 't') { togglePanel(); ev.preventDefault(); return; }
    if (uiHasFocus()) return;   // a focused control owns its keys, not the player
    keys[k] = true;
    if (k === ' ' || k.indexOf('arrow') === 0) ev.preventDefault();
    onKey(k);
  });
  window.addEventListener('keyup', function (ev) { keys[ev.key.toLowerCase()] = false; });
  window.addEventListener('blur', function () { keys = {}; });
  canvas.addEventListener('mousemove', function (ev) { mouse.x = ev.clientX; mouse.y = ev.clientY; });
  canvas.addEventListener('mousedown', onClick);
  requestAnimationFrame(frame);
}

// ---------- self-test ----------
// ponytail: asserts on the logic that fails silently during play. No framework, no fixtures.
function selfTest() {
  var out = [], pass = 0, fail = 0;
  function ok(name, cond) {
    if (cond) { pass++; out.push('PASS  ' + name); }
    else { fail++; out.push('FAIL  ' + name); }
  }

  // xp curve must never plateau or you soft-lock on levels
  var inc = true;
  for (var l = 1; l < 60; l++) if (xpForLevel(l + 1) <= xpForLevel(l)) inc = false;
  ok('xpForLevel strictly increasing', inc);

  // circle overlap boundaries
  ok('overlap: far apart is false', !overlaps({ x: 0, y: 0, r: 5 }, { x: 100, y: 0, r: 5 }));
  ok('overlap: exactly touching is false', !overlaps({ x: 0, y: 0, r: 5 }, { x: 10, y: 0, r: 5 }));
  ok('overlap: just inside is true', overlaps({ x: 0, y: 0, r: 5 }, { x: 9.9, y: 0, r: 5 }));

  // difficulty must actually ramp
  ok('spawn pool grows with time', spawnPool(200).length > spawnPool(0).length);
  ok('spawn interval shrinks with time', spawnEvery(200) < spawnEvery(0));
  ok('enemy hp scales with time', hpScale(200) > hpScale(0));

  // upgrade cards
  newGame('play');
  var cards = pickUpgrades(S);
  ok('pickUpgrades returns 3', cards.length === 3);
  ok('pickUpgrades returns distinct', cards[0].key !== cards[1].key && cards[1].key !== cards[2].key && cards[0].key !== cards[2].key);

  newGame('play');
  for (var i = 0; i < PASSIVES.dmg.max; i++) applyUpgrade(S, { kind: 'pass', key: 'dmg' });
  var maxed = upgradePool(S).filter(function (c) { return c.key === 'dmg'; });
  ok('maxed passive leaves the pool', maxed.length === 0 && S.passives.dmg === PASSIVES.dmg.max);
  ok('maxed passive applied 5 times', Math.abs(S.stats.dmg - Math.pow(1.2, 5)) < 1e-9);

  newGame('play');
  applyUpgrade(S, { kind: 'wnew', key: 'nova' });
  ok('new weapon joins the loadout', S.weapons.length === 2 && !!findWeapon(S, 'nova'));
  applyUpgrade(S, { kind: 'wlvl', key: 'nova' });
  ok('weapon level up', findWeapon(S, 'nova').lvl === 2);
  var wnew = upgradePool(S).filter(function (c) { return c.kind === 'wnew' && c.key === 'nova'; });
  ok('owned weapon is not offered as new', wnew.length === 0);

  // player damage + i-frames
  newGame('play');
  ok('first hit lands', hurtPlayer(S, 30) === true && S.player.hp === 70);
  ok('second hit blocked by i-frames', hurtPlayer(S, 30) === false && S.player.hp === 70);
  S.player.ifr = 0;
  ok('hp clamps at zero', hurtPlayer(S, 9999) === true && S.player.hp === 0);
  ok('death sets mode once', S.mode === 'dead');
  ok('no damage after death', hurtPlayer(S, 10) === false);

  // xp -> level -> pending upgrades
  newGame('play');
  gainXp(S, xpForLevel(1));
  ok('one lump of xp levels once', S.player.level === 2 && S.pending === 1 && S.mode === 'levelup');
  newGame('play');
  gainXp(S, 100000);
  ok('big lump queues many levels', S.player.level > 5 && S.pending === S.player.level - 1);
  var before = S.pending;
  chooseCard(0);
  ok('choosing a card burns one pending', S.pending === before - 1 && S.mode === 'levelup');

  // every weapon must actually emit something
  for (var k in WEAPONS) {
    newGame('play');
    S.weapons = [{ key: k, lvl: 1, t: 0 }];
    spawnEnemy(S, 'grunt');
    S.enemies[0].x = S.player.x + 60; S.enemies[0].y = S.player.y;
    var n0 = S.bullets.length;
    WEAPONS[k].fire(S, S.weapons[0]);
    ok('weapon ' + k + ' emits a projectile', S.bullets.length > n0);
  }

  // full kill loop through update(): bullet -> damage -> death -> gem -> xp
  // The enemy dies far from the player on purpose: gems scatter +/-14px, so a kill up close
  // can drop a gem already inside the 17px pickup radius and collect it on the same frame.
  newGame('play');
  var e = spawnEnemy(S, 'grunt');
  e.x = S.player.x + 300; e.y = S.player.y;
  S.bullets.push(bullet({ x: e.x, y: e.y, r: 8, dmg: 9999, life: 1 }));
  update(0.016);
  ok('bullet kills enemy and increments kills', S.kills === 1);
  ok('death drops gems', S.gems.length > 0);
  var xp0 = S.player.xp;
  S.gems[0].x = S.player.x; S.gems[0].y = S.player.y;   // hand it straight to the player
  update(0.016);
  ok('gems get collected', S.player.xp > xp0);

  // pierce accounting: one non-piercing bullet damages exactly one enemy
  newGame('play');
  var a1 = spawnEnemy(S, 'tank'), a2 = spawnEnemy(S, 'tank');
  a1.x = S.player.x + 500; a1.y = S.player.y + 500;
  a2.x = a1.x + 2; a2.y = a1.y;
  S.weapons = [];
  S.bullets.push(bullet({ x: a1.x, y: a1.y, r: 10, dmg: 5, life: 1, pierce: 1 }));
  update(0.016);
  ok('single-pierce bullet hits exactly one target', (a1.hp < a1.maxhp) !== (a2.hp < a2.maxhp));

  // infinite-pierce bullet hits each enemy once, not once per frame
  newGame('play');
  S.stats.crit = 0;   // this assert measures an exact number; crits are random by design
  S.weapons = [];
  var b1 = spawnEnemy(S, 'tank');
  b1.x = S.player.x + 400; b1.y = S.player.y + 400;
  b1.speed = 0;
  S.bullets.push(bullet({ x: b1.x, y: b1.y, r: 40, dmg: 3, life: 2, pierce: Infinity }));
  var hp0 = b1.hp;
  update(0.016); update(0.016); update(0.016);
  ok('infinite pierce damages each enemy once', Math.abs((hp0 - b1.hp) - 3) < 1e-9);

  // ---- palette readability ----
  // A 3-minute run is unreadable if two enemy classes, or an enemy and the player, share a colour.
  var PLAYER_C = "#4ee1d0";
  var hex2rgb = function (h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
  var far = function (h1, h2) {
    var a = hex2rgb(h1), b = hex2rgb(h2);
    return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) > 90;
  };
  var clash = [];
  var ekeys = Object.keys(ETYPES);
  for (var ei = 0; ei < ekeys.length; ei++) {
    if (ekeys[ei] !== "shard" && !far(ETYPES[ekeys[ei]].c, PLAYER_C)) clash.push(ekeys[ei] + " vs player");
    for (var ej = ei + 1; ej < ekeys.length; ej++) {
      if (ekeys[ei] === "splitter" && ekeys[ej] === "shard") continue;   // same family on purpose
      if (!far(ETYPES[ekeys[ei]].c, ETYPES[ekeys[ej]].c)) clash.push(ekeys[ei] + " vs " + ekeys[ej]);
    }
  }
  ok("enemy colours stay distinct from each other and the player" + (clash.length ? " [" + clash.join(", ") + "]" : ""), clash.length === 0);

  // ---- crits ----
  newGame('play');
  S.weapons = [];
  S.stats.crit = 0;
  var ce = spawnEnemy(S, 'tank'); ce.x = S.player.x + 400; ce.y = S.player.y;
  var chp = ce.hp;
  hurtEnemy(S, ce, 10);
  ok('no crit deals base damage', Math.abs((chp - ce.hp) - 10) < 1e-9);
  S.stats.crit = 1;
  chp = ce.hp;
  hurtEnemy(S, ce, 10);
  ok('guaranteed crit deals 2.2x', Math.abs((chp - ce.hp) - 22) < 1e-9);
  ok('crit damage number is flagged big', S.texts[S.texts.length - 1].big === true);

  // ---- knockback ----
  newGame('play');
  S.stats.crit = 0;
  var ke = spawnEnemy(S, 'grunt'); ke.x = 500; ke.y = 0;
  var kbefore = ke.x;
  hurtEnemy(S, ke, 1, { x: 400, y: 0 });          // hit from the left
  ok('knockback pushes away from the source', ke.x > kbefore);
  var kgrunt = ke.x - kbefore;
  var kt = spawnEnemy(S, 'tank'); kt.x = 500; kt.y = 0;
  var tbefore = kt.x;
  hurtEnemy(S, kt, 1, { x: 400, y: 0 });
  ok('bigger enemies are shoved less', (kt.x - tbefore) < kgrunt);
  ok('knockback stays under one second of approach', kgrunt < ETYPES.grunt.speed);
  var kn = spawnEnemy(S, 'grunt'); kn.x = 500; kn.y = 0;
  hurtEnemy(S, kn, 1);                             // no source
  ok('no source means no knockback', kn.x === 500);

  // ---- hearts ----
  newGame('play');
  S.player.maxhp = 100; S.player.hp = 40;
  S.gems.push({ x: S.player.x + 300, y: S.player.y, r: 9, xp: 0, heal: 30, c: '#ff6b8a' });
  var hx = S.gems[0].x;
  S.player.magnet = 1000;                          // magnet would grab a gem at this range
  update(0.05);
  ok('the magnet ignores hearts', S.gems.length === 1 && S.gems[0].x === hx);
  S.gems[0].x = S.player.x; S.gems[0].y = S.player.y;
  update(0.016);
  ok('walking into a heart heals you', S.player.hp === 70);
  S.player.hp = 95;
  S.gems.push({ x: S.player.x, y: S.player.y, r: 9, xp: 0, heal: 30, c: '#ff6b8a' });
  update(0.016);
  ok('healing never exceeds max hp', S.player.hp === 100);

  // ---- splitters ----
  newGame('play');
  S.weapons = [];
  var sp = spawnEnemy(S, 'splitter'); sp.x = 600; sp.y = 600;
  ok('splitter carries its split count', sp.splits === 2);
  hurtEnemy(S, sp, 99999);
  var shards = S.enemies.filter(function (x) { return x.type === 'shard' && !x.dead; });
  ok('a dying splitter spawns shards', shards.length === 2);
  ok('shards spawn where it died', Math.abs(shards[0].x - 600) < 40);
  hurtEnemy(S, shards[0], 99999);
  ok('shards do not split again', S.enemies.filter(function (x) { return x.type === 'shard' && !x.dead; }).length === 1);
  ok('shard is never in a spawn pool', spawnPool(999).indexOf('shard') === -1);

  // ---- evolutions ----
  newGame('play');
  ok('hidden weapons are never offered as new',
     upgradePool(S).filter(function (c) { return c.kind === 'wnew' && WEAPONS[c.key].hidden; }).length === 0);
  var evoOf = function () { return upgradePool(S).filter(function (c) { return c.kind === 'evo'; }); };
  ok('no evolution at level 1', evoOf().length === 0);
  findWeapon(S, 'bolt').lvl = EVO_WEAPON_LVL;
  ok('weapon level alone does not evolve', evoOf().length === 0);
  for (var pi = 0; pi < EVO_PASSIVE_LVL; pi++) applyUpgrade(S, { kind: 'pass', key: 'extra' });
  var evos = evoOf();
  ok('weapon level plus paired passive offers the evolution', evos.length === 1 && evos[0].into === 'railgun');
  var slots = S.weapons.length;
  applyUpgrade(S, evos[0]);
  ok('evolving reuses the slot', S.weapons.length === slots);
  ok('the weapon became its evolved form', !!findWeapon(S, 'railgun') && !findWeapon(S, 'bolt'));
  ok('an evolved weapon is never offered again',
     upgradePool(S).filter(function (c) { return c.kind === 'evo' || c.key === 'railgun'; }).length === 0);
  var railBullets = S.bullets.length;
  spawnEnemy(S, 'grunt');
  WEAPONS.railgun.fire(S, findWeapon(S, 'railgun'));
  ok('the evolved weapon actually fires', S.bullets.length > railBullets);
  // every evolution must point at a real, hidden weapon
  var evoOk = true;
  for (var wk in WEAPONS) {
    var sp2 = WEAPONS[wk].evo;
    if (!sp2) continue;
    if (!WEAPONS[sp2.into] || !WEAPONS[sp2.into].hidden || !PASSIVES[sp2.passive]) evoOk = false;
  }
  ok('every evo pairing resolves to a hidden weapon and a real passive', evoOk);

  // ---- tunables ----
  // These mutate globals, so this block runs last and puts everything back at the end.
  var tkeys = {}, dupes = [], oob = [], noRound = [];
  for (var ti = 0; ti < TUNABLES.length; ti++) {
    var T = TUNABLES[ti];
    if (tkeys[T.key]) dupes.push(T.key);
    tkeys[T.key] = 1;
    if (T.type !== 'bool') {
      var dv = TUNE_DEFAULTS[T.key];
      if (dv < T.min || dv > T.max) oob.push(T.key + '=' + dv + ' outside [' + T.min + ',' + T.max + ']');
      T.set(T.min); var lo = T.get();
      T.set(T.max); var hi = T.get();
      if (lo !== T.min || hi !== T.max) noRound.push(T.key);
    } else {
      T.set(false); var f0 = T.get();
      T.set(true); var f1 = T.get();
      if (f0 !== false || f1 !== true) noRound.push(T.key);
    }
  }
  ok('tunable keys are unique' + (dupes.length ? ' [' + dupes.join(', ') + ']' : ''), dupes.length === 0);
  ok('every default sits inside its own range' + (oob.length ? ' [' + oob.join('; ') + ']' : ''), oob.length === 0);
  ok('every tunable round-trips through set/get' + (noRound.length ? ' [' + noRound.join(', ') + ']' : ''), noRound.length === 0);

  resetTunables();
  var backToDefaults = true;
  for (var tj = 0; tj < TUNABLES.length; tj++) if (TUNABLES[tj].get() !== TUNE_DEFAULTS[TUNABLES[tj].key]) backToDefaults = false;
  ok('reset restores every default', backToDefaults);

  // knobs must actually reach the functions they claim to control
  var hp0 = hpScale(100), sp0 = spawnEvery(100), xp0 = xpForLevel(3);
  findTunable('hpRamp').set(300);
  findTunable('spawnRamp').set(400);
  findTunable('xpStep').set(12);
  ok('HP ramp knob changes hpScale', hpScale(100) !== hp0);
  ok('spawn ramp knob changes spawnEvery', spawnEvery(100) !== sp0);
  ok('XP knob changes xpForLevel', xpForLevel(3) !== xp0);
  ok('XP curve stays strictly increasing at any setting', xpForLevel(9) > xpForLevel(8));
  resetTunables();
  ok('reset puts the curves back', hpScale(100) === hp0 && spawnEvery(100) === sp0 && xpForLevel(3) === xp0);

  // a corrupt or hostile save must never poison a knob
  applyTuning({ hpRamp: 999999 });
  ok('out-of-range values clamp to max', HP_RAMP === findTunable('hpRamp').max);
  applyTuning({ hpRamp: -50 });
  ok('out-of-range values clamp to min', HP_RAMP === findTunable('hpRamp').min);
  applyTuning({ hpRamp: 'banana' });
  ok('non-numeric values are ignored', HP_RAMP === findTunable('hpRamp').min);
  applyTuning({ nonsenseKnobName: 5 });
  ok('unknown keys are ignored', true);
  applyTuning(null);
  ok('a null save is survivable', true);
  resetTunables();

  var snapshot = tuningToJSON();
  findTunable('bossAt').set(300);
  findTunable('dmgnum').set(false);
  applyTuning(snapshot);
  ok('tuningToJSON round-trips through applyTuning', BOSS_T === TUNE_DEFAULTS.bossAt && SHOW_DMG === TUNE_DEFAULTS.dmgnum);

  // the two settings that must visibly do something
  newGame('play');
  S.stats.crit = 0;
  var de = spawnEnemy(S, 'tank'); de.x = 900; de.y = 900;
  SHOW_DMG = false;
  var texts0 = S.texts.length;
  hurtEnemy(S, de, 5);
  ok('damage numbers off suppresses the text', S.texts.length === texts0);
  SHOW_DMG = true;
  hurtEnemy(S, de, 5);
  ok('damage numbers on restores the text', S.texts.length === texts0 + 1);
  VOLUME = 0;
  snd(440, 0.05);
  ok('muted audio is a silent no-op', true);
  resetTunables();
  ok('tunables end the suite at their defaults', VOLUME === TUNE_DEFAULTS.volume && SHOW_DMG === TUNE_DEFAULTS.dmgnum);

  out.push('');
  out.push(fail === 0 ? ('ALL GREEN  ' + pass + ' passed') : (fail + ' FAILED, ' + pass + ' passed'));
  return { out: out, pass: pass, fail: fail };
}

if (typeof document !== 'undefined') {
  if (location.search.indexOf('test') >= 0) {
    var r = selfTest();
    document.body.innerHTML = '<pre id="test">' + r.out.join('\n') + '</pre>';
  } else {
    boot();
  }
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { selfTest: selfTest, newGame: newGame, get S() { return S; } };
}
</script>
