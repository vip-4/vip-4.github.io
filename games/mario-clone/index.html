<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 768px;
            height: 720px;
        }
        #container {
            position: relative;
        }
        #debug {
            position: absolute;
            top: 0;
            left: 770px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            background: rgba(0,0,0,0.8);
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="gameCanvas" width="256" height="240"></canvas>
        <div id="debug"></div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
